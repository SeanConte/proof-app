// =============================================================================
// GUIDED MODE: rendering
// =============================================================================
function slotRoleHtml(rule, slotId, f, F, side) {
  const spec = GUIDED_RULES[rule];
  const slot = spec && (spec.slots || []).find(s => s.id === slotId);
  if (!slot || !f) return escapeHtml(render(f));
  switch (slot.role) {
    case 'split':
      if (rule === '·E' && side) return side === 'L'
        ? hl('R', renderSub(f.left)) + ' ' + hl('M', '·') + ' ' + hl('L', renderSub(f.right))
        : hl('L', renderSub(f.left)) + ' ' + hl('M', '·') + ' ' + hl('R', renderSub(f.right));
      return hlSplit(f);
    case 'L': return hlWhole(f, 'L');
    case 'R': return hlWhole(f, 'R');
    case 'side': return hlWhole(f, F.bic && eq(f, F.bic.right) && !eq(f, F.bic.left) ? 'R' : 'L');
    case 'known': return hlWhole(f, side === 'R' ? 'R' : 'L');
    case 'dneg': return hlDoubleNeg(f);
    case 'negL': return hl('M', '¬') + hl('L', renderSub(f.child));
    default: return escapeHtml(render(f));
  }
}

// Colors the sources of a finished line the same way the rule template does.
function inspectionInfo(P, id) {
  const l = gFind(P, id);
  const html = {}, src = new Set();
  if (!l || !l.f) return { html, src };
  const set = (lid, x) => { if (lid) { html[lid] = x; src.add(lid); } };
  const ast = lid => { const x = gFind(P, lid); return x ? (x.f || x.target) : null; };
  const refs = l.refs || [];
  const sub = k => { const sid = (l.subs || [])[k]; return sid && P.subs[sid] ? P.subs[sid] : null; };
  switch (l.rule) {
    case '→E': set(refs[0], hlSplit(ast(refs[0]))); set(refs[1], hlWhole(ast(refs[1]), 'L')); html[id] = hlWhole(l.f, 'R'); break;
    case '↔E': {
      const b = ast(refs[0]), s = ast(refs[1]), left = eq(s, b.left);
      set(refs[0], hlSplit(b)); set(refs[1], hlWhole(s, left ? 'L' : 'R')); html[id] = hlWhole(l.f, left ? 'R' : 'L'); break;
    }
    case '·E': set(refs[0], slotRoleHtml('·E', 'conj', ast(refs[0]), {}, l.side || (eq(l.f, ast(refs[0]).left) ? 'L' : 'R'))); html[id] = hlWhole(l.f, 'R'); break;
    case '·I':
      if (refs[0] === refs[1]) set(refs[0], hlWhole(ast(refs[0]), 'W'));
      else { set(refs[0], hlWhole(ast(refs[0]), 'L')); set(refs[1], hlWhole(ast(refs[1]), 'R')); }
      html[id] = hlSplit(l.f); break;
    case '∨I': set(refs[0], hlWhole(ast(refs[0]), l.side === 'R' ? 'R' : 'L')); html[id] = hlSplit(l.f); break;
    case '¬E': set(refs[0], hlDoubleNeg(ast(refs[0]))); html[id] = hlWhole(l.f, 'R'); break;
    case 'Reit': set(refs[0], hlWhole(ast(refs[0]), 'L')); html[id] = hlWhole(l.f, 'L'); break;
    case 'Expl': set(refs[0], hlWhole(ast(refs[0]), 'L')); set(refs[1], hl('M', '¬') + hl('L', renderSub(ast(refs[1]).child))); html[id] = hlWhole(l.f, 'W'); break;
    case '→I': { const s = sub(0); if (s) { set(s.assume, hlWhole(ast(s.assume), 'L')); set(s.goal, hlWhole(ast(s.goal), 'R')); } html[id] = hlSplit(l.f); break; }
    case '↔I': {
      const a = sub(0), b = sub(1);
      if (a) { set(a.assume, hlWhole(ast(a.assume), 'L')); set(a.goal, hlWhole(ast(a.goal), 'R')); }
      if (b) { set(b.assume, hlWhole(ast(b.assume), 'R')); set(b.goal, hlWhole(ast(b.goal), 'L')); }
      html[id] = hlSplit(l.f); break;
    }
    case '¬I': {
      const s = sub(0);
      if (s) {
        set(s.assume, hlWhole(ast(s.assume), 'R'));
        const g = ast(s.goal);
        set(s.goal, g && g.type === 'and' ? hl('L', renderSub(g.left)) + ' ' + hl('M', '·') + ' ' + hl('M', '¬') + hl('L', renderSub(g.left)) : hlWhole(g, 'L'));
      }
      html[id] = hl('M', '¬') + hl('R', renderSub(l.f.child)); break;
    }
    case '∨E': {
      set(refs[0], hlSplit(ast(refs[0])));
      const a = sub(0), b = sub(1);
      if (a) { set(a.assume, hlWhole(ast(a.assume), 'L')); set(a.goal, hlWhole(ast(a.goal), 'M')); }
      if (b) { set(b.assume, hlWhole(ast(b.assume), 'R')); set(b.goal, hlWhole(ast(b.goal), 'M')); }
      html[id] = hlWhole(l.f, 'M'); break;
    }
    default: html[id] = hlWhole(l.f, 'W');
  }
  return { html, src };
}

function renderGuidedLines(host) {
  const P = S.gp, m = S.move;
  const numOf = id => gIndex(P, id) + 1;
  const ruleOpen = !!m.rule;
  const cands = ruleOpen && m.active ? new Set(gSlotCandidates(P, m, m.active).map(l => l.id)) : null;
  const F = ruleOpen ? Object.fromEntries(Object.entries(m.fills).map(([k, v]) => [k, gFind(P, v) && gFind(P, v).f])) : {};
  const slotOf = {};
  if (ruleOpen) Object.entries(m.fills).forEach(([slot, lid]) => { slotOf[lid] = slot; });
  const insp = S.inspect && !ruleOpen ? inspectionInfo(P, S.inspect) : null;
  const ev = ruleOpen ? gEvaluateMove(P, m) : null;
  const lastPremise = P.lines.reduce((acc, l, i) => (l.kind === 'premise' ? i : acc), -1);

  const rows = [];
  P.lines.forEach((l, i) => {
    if (isOpenGoal(l)) rows.push({ type: 'gap', goal: l, scope: l.scope });
    rows.push({ type: 'line', line: l, idx: i, scope: l.scope });
  });
  computeBars(rows);

  rows.forEach(r => {
    if (r.type === 'gap') {
      const current = m.goal === r.goal.id;
      const btn = h('button', {
        class: 'add-step', type: 'button', disabled: ruleOpen && !current,
        'aria-label': current ? 'The next step goes here, above the goal ' + render(r.goal.target) : 'Add a step toward ' + render(r.goal.target),
        onclick: e => { e.stopPropagation(); guidedSelectGoal(r.goal.id); }
      }, h('span', { class: 'plus', 'aria-hidden': 'true' }, '+'), current ? 'next step goes here' : 'add a step');
      let preview = null;
      if (current && ev && ev.ready) {
        preview = h('span', { class: 'gap-preview', html: escapeHtml(render(ev.result)) + '<span class="note">' + (ev.closesGoal ? 'closes the goal below' : 'new line') + '</span>' });
      }
      host.append(rowEl(r, { classes: ['gap'].concat(current ? ['current'] : []), fxHtml: null, extraBody: h('span', { class: 'gap-wrap' }, btn, preview) }));
      return;
    }
    const l = r.line;
    const classes = ['line', l.kind].concat(isOpenGoal(l) ? ['open'] : []);
    let fxHtml = escapeHtml(render(l.f || l.target));
    let clickable = false;
    if (isOpenGoal(l)) { if (m.goal === l.id) classes.push('current'); }
    if (cands) {
      if (cands.has(l.id)) { classes.push('cand'); clickable = true; fxHtml = slotRoleHtml(m.rule, m.active, l.f, F, m.side); }
      else if (!slotOf[l.id] && !isOpenGoal(l)) classes.push('dim');
    }
    if (slotOf[l.id]) { classes.push('slotted'); fxHtml = slotRoleHtml(m.rule, slotOf[l.id], l.f, F, m.side); }
    if (insp) {
      if (insp.html[l.id]) fxHtml = insp.html[l.id];
      if (l.id === S.inspect) classes.push('inspect');
      else if (insp.src.has(l.id)) classes.push('src');
    }
    if (!ruleOpen && l.f) clickable = true;
    if (S.delPreview && S.delPreview.has(l.id)) classes.push('del');
    if (S.flashId === l.id) classes.push('flash');
    if (clickable) classes.push('clickable');

    let just;
    if (isOpenGoal(l)) just = '<span class="goal-tag">goal</span>';
    else {
      just = escapeHtml(gJustText(P, l, numOf));
      if (gPending(P, l)) just += '<span class="pending-tag" title="Waiting on its subproof(s)">open</span>';
    }
    let trash = null;
    if (!ruleOpen && gCanDelete(l)) {
      trash = h('button', {
        class: 'trash', type: 'button', title: l.kind === 'goal' ? 'Clear this line (the goal reopens)' : l.kind === 'assume' ? 'Remove this subproof' : 'Delete this line and anything that depends on it',
        'aria-label': 'Delete line ' + (r.idx + 1),
        onclick: e => { e.stopPropagation(); guidedDelete(l.id); },
        onmouseenter: () => { const plan = gPlanDelete(P, l.id); S.delPreview = new Set([...plan.del, ...plan.revert]); markDeletePreview(); },
        onmouseleave: () => { S.delPreview = null; markDeletePreview(); }
      }, '🗑');
    }
    const hbar = l.kind === 'assume' || (r.idx === lastPremise && P.lines.length > lastPremise + 1);
    host.append(rowEl(r, {
      classes, numHtml: String(r.idx + 1), fxHtml, fxClass: hbar ? 'hbar' : '', justHtml: just, actEl: trash,
      onclick: () => guidedClickLine(l.id)
    }));
  });
}

function markDeletePreview() {
  document.querySelectorAll('#proof-lines .row.line').forEach(row => {
    row.classList.toggle('del', !!(S.delPreview && S.delPreview.has(row.dataset.id)));
  });
}

function guidedStatus() {
  const P = S.gp, m = S.move;
  if (gComplete(P)) return setStatus('✓ Proof complete. ' + fxInline(S.conclusion) + ' follows from the premises.', 'done');
  const goal = gFind(P, m.goal);
  if (!goal) return setStatus('Click <b>+ add a step</b> above a goal to choose where your next step goes.');
  const g = fxInline(goal.target);
  if (!m.rule) {
    if (S.inspect) return setStatus('Showing where line ' + (gIndex(P, S.inspect) + 1) + ' comes from. Click it again (or press Esc) to clear. Working toward ' + g + '.');
    return setStatus('Working toward ' + g + '. Choose a rule' + (gOpenGoals(P).length > 1 ? ', or click another <b>+</b> to work on a different goal.' : '.'));
  }
  const ev = gEvaluateMove(P, m);
  if (ev.ready) return setStatus('Ready: ' + fxInline(ev.result) + (ev.closesGoal ? ' closes the goal.' : ' goes in as a new line.') + ' Press <b>Execute</b> or Enter.', 'ready');
  const first = ev.missing[0];
  if (first.slot) {
    const spec = GUIDED_RULES[m.rule], slot = spec.slots.find(s => s.id === (m.active || first.slot));
    return setStatus('Click a highlighted line for <b>' + escapeHtml(slot.label) + '</b>.');
  }
  if (first.option) return setStatus(escapeHtml(first.label) + '.');
  return setStatus('Enter a formula for <b>' + escapeHtml(first.label) + '</b>' + (ev.inputErrors[first.input] ? ' (' + escapeHtml(ev.inputErrors[first.input]) + ')' : '') + '.');
}

function renderStatus() { if (S.mode === 'guided') guidedStatus(); else freeStatus(); }

// ── Rule bank ────────────────────────────────────────────────────────────────
const RULE_SYMBOL = { '¬I': '¬', '∨I': '∨', '·I': '·', '→I': '→', '↔I': '↔', '¬E': '¬', '∨E': '∨', '·E': '·', '→E': '→', '↔E': '↔' };
function buildRuleBank() {
  const grid = $('rules-grid'), aux = $('aux-rules');
  RULE_ORDER.forEach(rule => {
    const isAux = rule === 'Reit' || rule === 'Expl';
    const sym = isAux ? (rule === 'Reit' ? '🦜' : '💥') : RULE_SYMBOL[rule];
    const label = isAux ? rule : (rule.endsWith('I') ? 'Intro' : 'Elim');
    const btn = h('button', { class: 'rule-btn', type: 'button', dataset: { rule }, 'aria-label': rule + ' ' + RULE_INFO[rule].title },
      h('span', { class: 'rule-sym' + (isAux ? ' emoji' : ''), 'aria-hidden': 'true' }, sym),
      h('span', { class: 'rule-label', 'aria-hidden': 'true' }, label));
    btn.addEventListener('click', () => { hideTooltip(); if (S.mode === 'guided') guidedChooseRule(rule); else freeChooseRule(rule); });
    btn.addEventListener('mouseenter', () => showRuleTooltip(btn, rule));
    btn.addEventListener('mouseleave', hideTooltip);
    btn.addEventListener('focus', () => showRuleTooltip(btn, rule));
    btn.addEventListener('blur', hideTooltip);
    (isAux ? aux : grid).append(btn);
  });
}

function renderRuleBank() {
  const guided = S.mode === 'guided';
  const m = S.move;
  const editLine = !guided && S.editId ? fFind(S.fp, S.editId) : null;
  document.querySelectorAll('.rule-btn').forEach(btn => {
    const rule = btn.dataset.rule;
    let off, on;
    if (guided) {
      off = !m.goal || gComplete(S.gp) || !gRuleApplicable(S.gp, rule, m.goal);
      on = m.rule === rule;
    } else {
      off = !editLine || editLine.kind === 'premise';
      on = !!editLine && editLine.rule === rule;
    }
    btn.classList.toggle('off', off);
    btn.classList.toggle('on', on);
    btn.setAttribute('aria-disabled', off ? 'true' : 'false');
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  $('rule-bank').classList.toggle('hidden', guided && !!m.rule);
  $('rule-bank-title').textContent = guided ? 'Rules' : 'Rule for the selected line';
  let note = '';
  if (guided) {
    if (gComplete(S.gp)) note = '';
    else if (!m.goal) note = 'Choose where the step goes first.';
    else note = 'Faded rules have nothing to work with at this goal. Hover a rule to see its pattern.';
  } else note = editLine && editLine.kind !== 'premise' ? 'Click a rule to justify line ' + (fIndex(S.fp, editLine.id) + 1) + '. Click it again to clear it.' : 'Select a line to give it a rule.';
  $('rule-bank-note').textContent = note;
}

// ── Tooltip ──────────────────────────────────────────────────────────────────
function showRuleTooltip(btn, rule) {
  const tip = $('tooltip');
  tip.innerHTML = '<h6>' + escapeHtml(rule + '  ' + RULE_INFO[rule].title) + '</h6><div class="schema-wrap">' + schemaHtml(rule) + '</div><p>' + escapeHtml(RULE_INFO[rule].desc) + '</p>';
  tip.classList.remove('hidden');
  const r = btn.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight, m = 8;
  let left = r.left + r.width / 2 - tw / 2;
  left = Math.max(m, Math.min(left, window.innerWidth - tw - m));
  let top = r.top - th - 10;
  if (top < m) top = r.bottom + 10;
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
}
function hideTooltip() { $('tooltip').classList.add('hidden'); }

// ── Step panel (the rule template) ──────────────────────────────────────────
function liveSchemaHtml(rule, F, I, side) {
  const cls = { L: 'tt-l', R: 'tt-r', M: 'tt-m' };
  const piece = (f, role, greek, whole) => '<span class="' + cls[role] + '">' + (f ? escapeHtml(whole ? render(f) : renderSub(f)) : greek) + '</span>';
  const ln = x => '<div class="sc-line">' + x + '</div>';
  const cc = x => '<div class="sc-concl">' + x + '</div>';
  const sub = (a, b) => '<div class="sc-sub">' + ln(a) + ln('⋮') + ln(b) + '</div>';
  const box = x => '<div class="sc-box live">' + x + '</div>';
  switch (rule) {
    case '→E': {
      const c = F.cond, phi = c ? c.left : F.ant, psi = c ? c.right : null;
      return box(ln(piece(phi, 'L', 'φ') + ' → ' + piece(psi, 'R', 'ψ')) + ln(piece(phi, 'L', 'φ', true)) + cc(piece(psi, 'R', 'ψ', true)));
    }
    case '↔E': {
      const b = F.bic, s = F.side;
      const sideIsRight = b && s && eq(s, b.right) && !eq(s, b.left);
      const other = b && s ? (sideIsRight ? b.left : b.right) : null;
      return box(ln(piece(b && b.left, 'L', 'φ') + ' ↔ ' + piece(b && b.right, 'R', 'ψ')) + ln(piece(s, sideIsRight ? 'R' : 'L', 'φ', true)) + cc(piece(other, sideIsRight ? 'L' : 'R', 'ψ', true)));
    }
    case '·E': {
      const c = F.conj;
      const chosen = c && side ? (side === 'L' ? c.left : c.right) : null;
      return box(ln(piece(c && c.left, 'L', 'φ') + ' · ' + piece(c && c.right, 'R', 'ψ')) + cc(chosen ? piece(chosen, side === 'L' ? 'L' : 'R', '', true) : '<span class="ph">φ or ψ</span>'));
    }
    case '·I': return box(ln(piece(F.left, 'L', 'φ', true)) + ln(piece(F.right, 'R', 'ψ', true)) + cc(piece(F.left, 'L', 'φ') + ' · ' + piece(F.right, 'R', 'ψ')));
    case '∨I': {
      const k = F.known, o = I.other, rightSide = side === 'R';
      const known = piece(k, rightSide ? 'R' : 'L', rightSide ? 'ψ' : 'φ');
      const other = piece(o, rightSide ? 'L' : 'R', rightSide ? 'φ' : 'ψ');
      return box(ln(piece(k, rightSide ? 'R' : 'L', rightSide ? 'ψ' : 'φ', true)) + cc(rightSide ? other + ' ∨ ' + known : known + ' ∨ ' + other));
    }
    case '∨E': {
      const d = F.disj, t = I.theta;
      return box(ln(piece(d && d.left, 'L', 'φ') + ' ∨ ' + piece(d && d.right, 'R', 'ψ')) + sub(piece(d && d.left, 'L', 'φ', true), piece(t, 'M', 'θ', true)) + sub(piece(d && d.right, 'R', 'ψ', true), piece(t, 'M', 'θ', true)) + cc(piece(t, 'M', 'θ', true)));
    }
    case '¬E': { const d = F.dn, phi = d ? d.child.child : null; return box(ln('¬¬' + piece(phi, 'R', 'φ')) + cc(piece(phi, 'R', 'φ', true))); }
    case '¬I': return box(sub(piece(I.assume, 'R', 'φ', true), piece(I.psi, 'L', 'ψ') + ' · ¬' + piece(I.psi, 'L', 'ψ')) + cc('¬' + piece(I.assume, 'R', 'φ')));
    case '→I': return box(sub(piece(I.ant, 'L', 'φ', true), piece(I.cons, 'R', 'ψ', true)) + cc(piece(I.ant, 'L', 'φ') + ' → ' + piece(I.cons, 'R', 'ψ')));
    case '↔I': return box(sub(piece(I.left, 'L', 'φ', true), piece(I.right, 'R', 'ψ', true)) + sub(piece(I.right, 'R', 'ψ', true), piece(I.left, 'L', 'φ', true)) + cc(piece(I.left, 'L', 'φ') + ' ↔ ' + piece(I.right, 'R', 'ψ')));
    case 'Reit': return box(ln(piece(F.line, 'L', 'φ', true)) + cc(piece(F.line, 'L', 'φ', true)));
    case 'Expl': { const phi = F.stmt || (F.neg ? F.neg.child : null); return box(ln(piece(phi, 'L', 'φ', true)) + ln('¬' + piece(phi, 'L', 'φ')) + cc(piece(I.psi, 'R', 'ψ', true))); }
    default: return '';
  }
}

function renderStepPanel() {
  const panel = $('step-panel');
  const guided = S.mode === 'guided';
  const m = S.move;
  if (!guided || !m || !m.rule) { panel.classList.add('hidden'); panel.innerHTML = ''; return; }
  const P = S.gp, spec = GUIDED_RULES[m.rule];
  const ev = gEvaluateMove(P, m);
  const F = slotFormulas(P, m.fills);
  const I = {};
  (spec.inputs || []).forEach(inp => { const f = parseOrNull(m.inputs[inp.id] || ''); if (f) I[inp.id] = f; });

  panel.classList.remove('hidden');
  panel.innerHTML = '';
  const title = h('div', { class: 'win-title' },
    h('span', null, h('span', { class: 'step-head-sym' }, m.rule), RULE_INFO[m.rule].title),
    h('button', { class: 'icon-btn', type: 'button', title: 'Cancel this step (Esc)', 'aria-label': 'Cancel this step', onclick: guidedCancelRule }, '×'));
  const body = h('div', { class: 'panel-body' });
  body.append(h('div', { class: 'schema-wrap', html: liveSchemaHtml(m.rule, F, I, m.side) }));

  (spec.slots || []).forEach(slot => {
    const lid = m.fills[slot.id];
    const line = lid ? gFind(P, lid) : null;
    const box = h('button', { class: 'slot-box' + (line ? ' filled' : '') + (m.active === slot.id ? ' active' : ''), type: 'button', 'aria-label': slot.label + (line ? ': line ' + (gIndex(P, lid) + 1) : ': empty'),
      onclick: () => { if (!line) { m.active = slot.id; renderApp(); } } });
    if (line) {
      box.append(h('span', { class: 'slot-num' }, String(gIndex(P, lid) + 1)), h('span', { class: 'slot-f', html: slotRoleHtml(m.rule, slot.id, line.f, F, m.side) }),
        h('span', { class: 'slot-clear', role: 'button', tabindex: '0', title: 'Clear', 'aria-label': 'Clear ' + slot.label,
          onclick: e => { e.stopPropagation(); gClearSlot(m, slot.id); renderApp(); },
          onkeydown: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); gClearSlot(m, slot.id); renderApp(); } } }, '×'));
    } else {
      box.append(h('span', { class: 'slot-hint' }, m.active === slot.id ? 'click a highlighted line' : 'click to fill this next'));
    }
    body.append(h('div', { class: 'slot' }, h('span', { class: 'slot-label' }, slot.label), box));
  });

  if (spec.option === 'conj') {
    const c = F.conj;
    body.append(h('div', { class: 'options-label' }, 'Which conjunct?'));
    body.append(h('div', { class: 'options' },
      ['L', 'R'].map(side => h('button', { class: 'bevel' + (m.side === side ? ' pressed' : ''), type: 'button', disabled: !c, 'aria-pressed': m.side === side ? 'true' : 'false',
        onclick: () => { m.side = side; renderApp(); } }, c ? 'Derive ' + render(side === 'L' ? c.left : c.right) : (side === 'L' ? 'Left conjunct' : 'Right conjunct')))));
  }
  if (spec.option === 'or') {
    const k = F.known ? render(F.known) : 'φ';
    const o = I.other ? render(I.other) : '…';
    const wrapK = F.known && isBinary(F.known) ? '(' + k + ')' : k;
    const wrapO = I.other && isBinary(I.other) ? '(' + o + ')' : o;
    body.append(h('div', { class: 'options-label' }, 'Where does your line go?'));
    body.append(h('div', { class: 'options' },
      h('button', { class: 'bevel' + (m.side === 'L' ? ' pressed' : ''), type: 'button', 'aria-pressed': m.side === 'L' ? 'true' : 'false', onclick: () => { m.side = 'L'; renderApp(); } }, wrapK + ' ∨ ' + wrapO),
      h('button', { class: 'bevel' + (m.side === 'R' ? ' pressed' : ''), type: 'button', 'aria-pressed': m.side === 'R' ? 'true' : 'false', onclick: () => { m.side = 'R'; renderApp(); } }, wrapO + ' ∨ ' + wrapK)));
  }

  if ((spec.inputs || []).length) {
    spec.inputs.forEach(inp => {
      const field = formulaField({ value: m.inputs[inp.id] || '', focusKey: 'step-' + inp.id, placeholder: 'type a formula',
        onChange: v => { m.inputs[inp.id] = v; refreshStepDynamic(); } });
      field.input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); guidedExecute(); } });
      body.append(h('div', { class: 'step-input' }, h('label', null, inp.label), field.el));
    });
    body.append(keypad(argumentAtoms()));
  }

  body.append(h('div', { class: 'result-box' + (ev.ready ? ' ready' : ''), id: 'step-result', html: stepResultHtml(ev) }));
  body.append(h('div', { class: 'step-actions' },
    h('button', { class: 'bevel', type: 'button', onclick: guidedCancelRule }, 'Cancel'),
    h('button', { class: 'bevel primary', type: 'button', id: 'execute-btn', disabled: !ev.ready, onclick: guidedExecute }, 'Execute')));
  panel.append(title, body);
}

function stepResultHtml(ev) {
  if (ev.ready) return 'Result: ' + fxInline(ev.result) + ' · ' + (ev.closesGoal ? '<span class="closes">closes the goal</span>' : 'new line above the goal') + (ev.blocks.length ? ' · opens ' + ev.blocks.length + ' subproof' + (ev.blocks.length > 1 ? 's' : '') : '');
  const labels = ev.missing.map(x => x.label);
  return 'Still needed: ' + escapeHtml(labels.join('; ')) + '.';
}

// Update the parts of the screen that depend on typed input, without
// rebuilding the input the student is typing in.
function refreshStepDynamic() {
  const P = S.gp, m = S.move, spec = GUIDED_RULES[m.rule];
  const ev = gEvaluateMove(P, m);
  const F = slotFormulas(P, m.fills), I = {};
  (spec.inputs || []).forEach(inp => { const f = parseOrNull(m.inputs[inp.id] || ''); if (f) I[inp.id] = f; });
  const panel = $('step-panel');
  const schema = panel.querySelector('.schema-wrap');
  if (schema) schema.innerHTML = liveSchemaHtml(m.rule, F, I, m.side);
  const res = $('step-result');
  if (res) { res.className = 'result-box' + (ev.ready ? ' ready' : ''); res.innerHTML = stepResultHtml(ev); }
  const exec = $('execute-btn');
  if (exec) exec.disabled = !ev.ready;
  if (spec.option === 'or') {
    const k = F.known ? render(F.known) : 'φ', o = I.other ? render(I.other) : '…';
    const wrapK = F.known && isBinary(F.known) ? '(' + k + ')' : k, wrapO = I.other && isBinary(I.other) ? '(' + o + ')' : o;
    const btns = panel.querySelectorAll('.options .bevel');
    if (btns.length === 2) { btns[0].textContent = wrapK + ' ∨ ' + wrapO; btns[1].textContent = wrapO + ' ∨ ' + wrapK; }
  }
  guidedStatus();
  const gapPrev = document.querySelector('.row.gap.current .gap-preview');
  if (gapPrev) gapPrev.remove();
  const gapRow = document.querySelector('.row.gap.current .gap-wrap');
  if (gapRow && ev.ready) gapRow.append(h('span', { class: 'gap-preview', html: escapeHtml(render(ev.result)) + '<span class="note">' + (ev.closesGoal ? 'closes the goal below' : 'new line') + '</span>' }));
}

// =============================================================================
// GUIDED MODE: actions
// =============================================================================
function guidedSelectGoal(goalId) {
  if (S.move.rule) return;
  S.move = newMove(goalId);
  S.inspect = null;
  const g = gFind(S.gp, goalId);
  logEvent('target', { goal: g ? render(g.target) : null });
  renderApp();
}

function guidedChooseRule(rule) {
  const P = S.gp, m = S.move;
  if (!m.goal || gComplete(P)) return;
  if (m.rule === rule) { guidedCancelRule(); return; }
  if (!gRuleApplicable(P, rule, m.goal)) return;
  S.inspect = null;
  gOpenRule(P, m, rule);
  logEvent('rule', { rule });
  renderApp();
  const first = document.querySelector('#step-panel .fx-input');
  if (first && !(GUIDED_RULES[rule].slots || []).length) { first.focus(); first.select(); }
}

function guidedCancelRule() {
  const m = S.move;
  if (!m.rule) return;
  logEvent('cancel', { rule: m.rule });
  S.move = newMove(m.goal);
  renderApp();
}

function guidedClickLine(id) {
  const P = S.gp, m = S.move;
  const l = gFind(P, id);
  if (!l) return;
  if (m.rule) {
    if (!m.active) return;
    if (!gSlotCandidates(P, m, m.active).some(c => c.id === id)) return;
    gFillSlot(P, m, m.active, id);
    renderApp();
    if (!m.active) {
      const inp = document.querySelector('#step-panel .fx-input');
      if (inp && !inp.value.trim()) inp.focus();
    }
    return;
  }
  if (!l.f) return;
  S.inspect = S.inspect === id ? null : id;
  if (S.inspect) logEvent('inspect', { n: gIndex(P, id) + 1, formula: render(l.f) });
  renderApp();
}

function guidedExecute() {
  const P = S.gp, m = S.move;
  const ev = gEvaluateMove(P, m);
  if (!ev.ready) return;
  pushUndo();
  const prevGoal = m.goal;
  const cited = (GUIDED_RULES[m.rule].slots || []).map(s => gIndex(P, m.fills[s.id]) + 1);
  const res = gApplyMove(P, m);
  if (!res) { S.undo.pop(); return; }
  const num = gIndex(P, res.line.id) + 1;
  logEvent('execute', { rule: m.rule, cited, line: { n: num, formula: render(res.line.f) }, closesGoal: res.closedGoal, subproofs: res.newSubs.length });
  S.flashId = res.line.id;
  S.move = newMove(gNextTarget(P, prevGoal, res.newSubs));
  S.inspect = null;
  S.completed = gComplete(P);
  renderApp();
  maybeCelebrate();
}

function guidedDelete(id) {
  const P = S.gp;
  const l = gFind(P, id);
  if (!l || !gCanDelete(l)) return;
  pushUndo();
  const result = gApplyDelete(P, id);
  if (!result) { S.undo.pop(); return; }
  logEvent('delete', { removed: result.removed, reverted: result.reverted });
  S.delPreview = null;
  S.inspect = null;
  S.move = newMove(gNextTarget(P, S.move.goal, []));
  S.completed = gComplete(P);
  renderApp();
}

function maybeCelebrate() {
  const done = S.mode === 'guided' ? gComplete(S.gp) : !!(S.check && S.check.complete);
  if (!done || S.congratsShown) return;
  S.congratsShown = true;
  logEvent('complete', { mode: S.mode });
  showCongrats();
}

// =============================================================================
// FREE MODE: rendering
// =============================================================================
function freeLineFxHtml(l) {
  if (l.f) return escapeHtml(render(l.f));
  if (String(l.src || '').trim()) return '<span class="raw-bad">' + escapeHtml(l.src) + '</span>';
  return '<span class="empty">empty line</span>';
}

function renderFreeLines(host) {
  const P = S.fp;
  const an = fAnalyze(P);
  const editIdx = S.editId ? fIndex(P, S.editId) : -1;
  const editLine = editIdx >= 0 ? P.lines[editIdx] : null;
  const cited = new Set();
  if (editLine) editLine.refs.forEach(r => {
    if (!r.a) return;
    const a = fIndex(P, r.a), b = r.b ? fIndex(P, r.b) : a;
    if (a < 0 || b < 0) return;
    for (let k = a; k <= b; k++) cited.add(P.lines[k].id);
  });
  const lastPremise = P.lines.reduce((acc, l, i) => (l.kind === 'premise' ? i : acc), -1);

  const rows = [];
  P.lines.forEach((l, i) => {
    rows.push({ type: 'line', line: l, idx: i, scope: an.info[i].scope });
    const res = S.check && S.check.results[i];
    if (res && res.msg) rows.push({ type: 'msg', idx: i, scope: an.info[i].scope, text: res.msg });
  });
  computeBars(rows);

  rows.forEach(r => {
    if (r.type === 'msg') {
      const row = rowEl(r, { classes: ['msg'], fxHtml: null, extraBody: h('span', { class: 'msg-row', style: 'padding-left:10px', text: '✗ Line ' + (r.idx + 1) + ': ' + r.text }) });
      host.append(row);
      return;
    }
    const l = r.line, i = r.idx;
    const editing = l.id === S.editId;
    const classes = ['line', 'free-line', l.kind, 'clickable'];
    if (editing) classes.push('editing');
    if (cited.has(l.id)) classes.push('cited');
    const res = S.check && S.check.results[i];
    if (res && res.msg) classes.push('bad-line');
    if (S.flashId === l.id) classes.push('flash');
    const hbar = l.kind === 'assume' || (i === lastPremise && P.lines.length > lastPremise + 1);
    const citable = !!editLine && i < editIdx && !fIsBlank(l) && editLine.kind === 'step';
    const numHtml = '<span>' + (i + 1) + '</span>';

    let fxHtml = null, extraBody = null, justHtml = '';
    if (editing && l.kind !== 'premise') {
      const field = h('input', { class: 'fx-input', type: 'text', value: l.src || '', placeholder: l.kind === 'assume' ? 'assumption' : 'formula', spellcheck: 'false', autocomplete: 'off', 'data-focus-key': 'src-' + l.id, 'aria-label': 'Formula for line ' + (i + 1) });
      attachLiveConversion(field, v => freeSetSrc(l.id, v));
      field.addEventListener('keydown', e => freeInputKeys(e, l.id));
      field.addEventListener('blur', () => { S.editSnapTaken = false; });
      extraBody = h('span', { class: 'fx' + (hbar ? ' hbar' : '') }, field);
      if (l.kind === 'assume') justHtml = 'Assume';
    } else {
      fxHtml = freeLineFxHtml(l);
      if (l.kind === 'premise') justHtml = 'Premise';
      else if (l.kind === 'assume') justHtml = 'Assume';
      else if (l.rule || l.refs.length) justHtml = escapeHtml((l.rule || '?') + ' ' + fRefsText(P, l.refs)).trim();
      else justHtml = '<span style="color:#aab0b9">—</span>';
    }

    const act = h('span', { style: 'display:flex;align-items:center;gap:2px' });
    if (res && !res.blank) act.append(h('span', { class: 'check-mark ' + (res.ok ? 'ok' : 'bad'), title: res.ok ? 'Checks out' : res.msg }, res.ok ? '✓' : '✗'));
    else if (l.kind !== 'premise') act.append(h('button', { class: 'trash', type: 'button', title: 'Delete line', 'aria-label': 'Delete line ' + (i + 1), onclick: e => { e.stopPropagation(); freeDeleteLine(l.id); } }, '🗑'));

    const row = rowEl(r, {
      classes, numHtml, fxHtml, fxClass: hbar ? 'hbar' : '', justHtml, actEl: act, extraBody,
      onclick: e => {
        if (e.target.closest && e.target.closest('input, button')) return;
        if (citable && (l.kind === 'premise' || e.target.closest('.num'))) { freeToggleCite(l.id); return; }
        if (l.kind !== 'premise' && !editing) freeSelect(l.id);
      }
    });
    if (citable) {
      const num = row.querySelector('.num');
      num.classList.add('citable');
      num.title = 'Cite line ' + (i + 1);
    }
    if (editing && l.kind === 'step') {
      const just = row.querySelector('.just');
      just.innerHTML = '';
      const pill = h('button', { class: 'rule-pill' + (l.rule ? '' : ' empty'), type: 'button', title: l.rule ? 'Clear the rule' : 'Choose a rule from the rule panel', onclick: e => { e.stopPropagation(); if (l.rule) freeChooseRule(l.rule); } }, l.rule || 'rule?');
      const draft = S.refDrafts[l.id];
      const cite = h('input', { class: 'cite-input', type: 'text', value: draft != null ? draft : fRefsText(P, l.refs), placeholder: 'lines', 'data-focus-key': 'refs-' + l.id, 'aria-label': 'Cited lines for line ' + (i + 1), spellcheck: 'false', autocomplete: 'off' });
      cite.addEventListener('input', () => { S.refDrafts[l.id] = cite.value; });
      cite.addEventListener('change', () => freeCommitRefs(l.id));
      cite.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); freeCommitRefs(l.id); freeNewLine(); }
        else if (e.key === 'Escape') { freeCommitRefs(l.id); freeDeselect(); }
      });
      just.append(h('span', { class: 'just-edit' }, pill, cite));
    }
    host.append(row);
  });
}

function freeStatus() {
  const P = S.fp;
  const goal = fxInline(S.conclusion);
  if (S.check) {
    if (S.check.complete) return setStatus('✓ Proof complete. Every line checks out and ' + goal + ' is on an unindented line.', 'done');
    if (S.check.problems) return setStatus(S.check.problems + ' line' + (S.check.problems > 1 ? 's need' : ' needs') + ' attention (marked ✗). Fix and check again.');
    return setStatus('Every line checks out so far. To finish, derive ' + goal + ' on an unindented line.');
  }
  const l = S.editId ? fFind(P, S.editId) : null;
  if (!l) return setStatus('Click a line to edit it. Goal: derive ' + goal + ' on an unindented line.');
  const n = fIndex(P, l.id) + 1;
  if (l.kind === 'assume') return setStatus('Line ' + n + ' is an assumption. Type the formula you are assuming. Enter adds the next line.');
  return setStatus('Line ' + n + ': type the formula, pick a rule, and cite lines (click line numbers or type them, e.g. <span class="fx-inline">2, 4–6</span>). Enter adds a line.');
}

function renderFreeTools() {
  const panel = $('free-tools');
  if (S.mode !== 'free') { panel.classList.add('hidden'); return; }
  panel.classList.remove('hidden');
  const P = S.fp;
  const l = S.editId ? fFind(P, S.editId) : null;
  panel.innerHTML = '';
  const body = h('div', { class: 'panel-body' });
  if (l) {
    const n = fIndex(P, l.id) + 1;
    body.append(h('div', { class: 'tool-label' }, 'Insert symbol'), keypad(argumentAtoms()));
    body.append(h('div', { class: 'tool-label' }, 'Line ' + n));
    const blank = fIsBlank(l);
    body.append(h('div', { class: 'tool-grid' },
      h('button', { class: 'bevel', type: 'button', title: 'Add a line below at the same depth (Enter)', onclick: freeNewLine }, '↵ New line'),
      h('button', { class: 'bevel', type: 'button', title: blank ? 'Make this line an assumption that starts a subproof' : 'Add an assumption below that starts a subproof', onclick: freeNewSubproof }, '⤷ New subproof'),
      h('button', { class: 'bevel', type: 'button', disabled: (l.depth | 0) === 0, title: blank ? 'Move this line out of the subproof' : 'Add a line below, one level out', onclick: freeEndSubproof }, '⤶ End subproof'),
      h('button', { class: 'bevel' + (l.kind === 'assume' ? ' pressed' : ''), type: 'button', 'aria-pressed': l.kind === 'assume' ? 'true' : 'false', title: 'Toggle whether this line is an assumption', onclick: freeToggleAssume }, l.kind === 'assume' ? '☑ Assumption' : '☐ Assumption'),
      h('button', { class: 'bevel', type: 'button', disabled: (l.depth | 0) === 0, onclick: () => freeShiftDepth(-1) }, '⇤ Outdent'),
      h('button', { class: 'bevel', type: 'button', onclick: () => freeShiftDepth(1) }, '⇥ Indent'),
      h('button', { class: 'bevel', type: 'button', onclick: () => freeDeleteLine(l.id) }, '🗑 Delete line')));
  } else {
    body.append(h('p', { class: 'free-help' }, 'Click any line to edit it. Lines are checked only when you press Check proof, so work at your own pace.'));
  }
  body.append(h('button', { class: 'bevel primary check-btn', type: 'button', onclick: freeCheckProof }, 'Check proof'));
  let summary = '', cls = '';
  if (S.check) {
    if (S.check.complete) { summary = '✓ Complete'; cls = 'ok'; }
    else if (S.check.problems) { summary = S.check.problems + ' problem' + (S.check.problems > 1 ? 's' : '') + ' found'; cls = 'bad'; }
    else { summary = 'No errors yet. The conclusion is not derived on an unindented line.'; }
  }
  body.append(h('div', { class: 'check-summary ' + cls, 'aria-live': 'polite' }, summary));
  panel.append(h('div', { class: 'win-title' }, 'Proof tools'), body);
}

// =============================================================================
// FREE MODE: actions
// =============================================================================
function freeTouch() { S.check = null; }
function freeSnapOnce() { if (!S.editSnapTaken) { pushUndo(); S.editSnapTaken = true; } }

function freeSelect(id) {
  const l = fFind(S.fp, id);
  if (!l || l.kind === 'premise') return;
  if (S.editId && S.editId !== id) freeCommitRefs(S.editId, true);
  S.editId = id;
  S.editSnapTaken = false;
  renderApp();
  focusFreeSrc();
}
function freeDeselect() {
  if (S.editId) freeCommitRefs(S.editId, true);
  S.editId = null;
  renderApp();
}
function focusFreeSrc() {
  const inp = S.editId && document.querySelector('[data-focus-key="src-' + CSS.escape(S.editId) + '"]');
  if (inp) { inp.focus(); const n = inp.value.length; try { inp.setSelectionRange(n, n); } catch (_) {} }
}

function freeSetSrc(id, value) {
  const l = fFind(S.fp, id);
  if (!l) return;
  if ((l.src || '') === value) return;
  freeSnapOnce();
  fSetSource(l, value);
  const hadCheck = !!S.check;
  freeTouch();
  if (hadCheck) renderApp(); else { renderHeader(); }
}

function freeCommitRefs(id, silent) {
  const draft = S.refDrafts[id];
  if (draft == null) return;
  delete S.refDrafts[id];
  const l = fFind(S.fp, id);
  if (!l) return;
  const next = fParseRefs(S.fp, draft);
  if (JSON.stringify(next) === JSON.stringify(l.refs)) return;
  pushUndo();
  l.refs = next;
  freeTouch();
  logEvent('cite', { n: fIndex(S.fp, id) + 1, refs: fRefsText(S.fp, l.refs) });
  if (!silent) renderApp();
}

function freeToggleCite(clickedId) {
  const P = S.fp, l = fFind(P, S.editId);
  if (!l || l.kind !== 'step') return;
  freeCommitRefs(l.id, true);
  pushUndo();
  if (!fToggleCite(P, l.id, clickedId)) { S.undo.pop(); return; }
  freeTouch();
  renderApp();
  focusFreeSrc();
}

function freeChooseRule(rule) {
  const l = S.editId ? fFind(S.fp, S.editId) : null;
  if (!l || l.kind === 'premise') return;
  pushUndo();
  if (l.kind === 'assume') { l.kind = 'step'; }
  l.rule = l.rule === rule ? null : rule;
  freeTouch();
  logEvent('set-rule', { n: fIndex(S.fp, l.id) + 1, rule: l.rule });
  renderApp();
  focusFreeSrc();
}

function freeToggleAssume() {
  const l = S.editId ? fFind(S.fp, S.editId) : null;
  if (!l || l.kind === 'premise') return;
  pushUndo();
  if (l.kind === 'assume') l.kind = 'step';
  else { l.kind = 'assume'; l.rule = null; l.refs = []; if ((l.depth | 0) === 0) l.depth = 1; }
  freeTouch();
  renderApp();
  focusFreeSrc();
}

function freeInsert(depth, kind) {
  const P = S.fp;
  const after = S.editId || P.lines[P.lines.length - 1].id;
  if (S.editId) freeCommitRefs(S.editId, true);
  pushUndo();
  const line = fInsertAfter(P, after, depth, kind);
  S.editId = line.id;
  S.editSnapTaken = false;
  freeTouch();
  logEvent('add-line', { n: fIndex(P, line.id) + 1, depth, kind });
  renderApp();
  focusFreeSrc();
}
function editDepth() { const l = S.editId && fFind(S.fp, S.editId); return l ? (l.depth | 0) : 0; }

function freeNewLine() { freeInsert(editDepth(), 'step'); }
function freeNewSubproof() {
  const l = S.editId && fFind(S.fp, S.editId);
  if (l && fIsBlank(l) && l.kind === 'step') {
    pushUndo();
    l.kind = 'assume'; l.depth = (l.depth | 0) + 1;
    freeTouch(); renderApp(); focusFreeSrc();
    return;
  }
  freeInsert(editDepth() + 1, 'assume');
}
function freeEndSubproof() {
  const l = S.editId && fFind(S.fp, S.editId);
  if (!l || (l.depth | 0) === 0) return;
  if (fIsBlank(l) && l.kind === 'step') { freeShiftDepth(-1); return; }
  freeInsert(Math.max(0, (l.depth | 0) - 1), 'step');
}
function freeShiftDepth(delta) {
  const l = S.editId && fFind(S.fp, S.editId);
  if (!l || l.kind === 'premise') return;
  const next = Math.max(0, (l.depth | 0) + delta);
  if (next === (l.depth | 0)) return;
  pushUndo();
  l.depth = next;
  freeTouch();
  renderApp();
  focusFreeSrc();
}
function freeDeleteLine(id) {
  const P = S.fp;
  const idx = fIndex(P, id);
  pushUndo();
  if (!fDelete(P, id)) { S.undo.pop(); return; }
  delete S.refDrafts[id];
  logEvent('delete', { n: idx + 1 });
  if (S.editId === id) {
    const next = P.lines[Math.min(idx, P.lines.length - 1)];
    S.editId = next && next.kind !== 'premise' ? next.id : (P.lines.find(l => l.kind !== 'premise') || {}).id || null;
  }
  freeTouch();
  renderApp();
  focusFreeSrc();
}

function freeInputKeys(e, id) {
  const P = S.fp;
  if (e.key === 'Enter') { e.preventDefault(); freeNewLine(); }
  else if (e.key === 'Escape') { e.preventDefault(); freeDeselect(); }
  else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    const i = fIndex(P, id), step = e.key === 'ArrowUp' ? -1 : 1;
    for (let k = i + step; k >= 0 && k < P.lines.length; k += step) {
      if (P.lines[k].kind !== 'premise') { e.preventDefault(); freeSelect(P.lines[k].id); return; }
    }
  }
}

function freeCheckProof() {
  if (S.editId) freeCommitRefs(S.editId, true);
  S.check = fCheck(S.fp, S.conclusion);
  const errors = [];
  S.check.results.forEach((r, i) => { if (r && r.msg) errors.push({ n: i + 1, error: r.msg }); });
  logEvent('check-proof', { result: S.check.complete ? 'complete' : errors.length ? 'errors' : 'incomplete', errors });
  renderApp();
  maybeCelebrate();
}

let interactionLog = [];
let logStartTime = null;
let loggingEnabled = true;
let hashesEnabled = true;

const LOG_PREAMBLES = {
  guided:
`// ProofApp interaction log (Guided mode, v${APP_VERSION})
// In guided mode the app only lets a student execute valid inferences.
// "target" = the student chose which open goal to work on; "rule" = opened a rule;
// "execute" = a step was added ("closesGoal" true means it finished that goal);
// "cancel", "delete", "undo", "redo" show backtracking. "t" is ms since the start.
// Useful things to look at: time between steps, rules opened and then cancelled,
// deletions and undos, and which goals took the longest.`,
  free:
`// ProofApp interaction log (Free mode, v${APP_VERSION})
// In free mode the student writes every line, chooses rules, and cites lines.
// Nothing is checked until a "check-proof" event, which lists every line that failed
// and why. "add-line", "set-rule", "cite", and "delete" record editing. "t" is ms
// since the start. Useful things to look at: the errors in each check, how they
// changed between checks, and how many checks preceded a complete proof.`
};

function logEvent(action, data) {
  if (!loggingEnabled || !logStartTime) return;
  interactionLog.push(Object.assign({ t: Date.now() - logStartTime, action }, data || {}));
}
function logStart() {
  logStartTime = Date.now();
  interactionLog = [];
  const ex = EXAMPLES[S.exampleKey];
  logEvent('start', { mode: S.mode, example: ex ? ex.number : 'custom', premises: S.premises.map(render), conclusion: render(S.conclusion), version: APP_VERSION });
}

function openModal({ title, bodyHtml = '', body = null, buttons = [], cls = '' }) {

function showCopyAssist(text, title) {
  const ta = h('textarea', { class: 'copy-area', readonly: true });
  ta.value = text;
  openModal({ title: title || 'Copy manually', bodyHtml: 'Your browser blocked automatic copying. The text below is selected: press <b>Ctrl+C</b> (or <b>⌘C</b>) to copy it.', body: ta, buttons: [{ label: 'Done', primary: true }] });
  setTimeout(() => { ta.focus(); ta.select(); }, 30);
}

async function copyText(text, title) {
  if (!text) return 'failed';
  try { await navigator.clipboard.writeText(text); return 'copied'; } catch (_) {}
  try {
    const ta = h('textarea', { readonly: true, style: 'position:fixed;opacity:0;pointer-events:none' });
    ta.value = text;
    document.body.append(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    if (ok) return 'copied';
  } catch (_) {}
  showCopyAssist(text, title);
  return 'manual';
}

function showCongrats() {
  const code = hashesEnabled ? completionCodeFor(EXAMPLES[S.exampleKey] ? S.exampleKey : null, S.premises, S.conclusion) : '';

  free: 'Write every line yourself, choose its rule, and cite its lines. Check the whole proof when you are ready.'

function setLandingMode(mode) {

function currentArgumentStrings() {
  if (S.exampleKey === 'custom') return { premises: S.custom.premises, conclusion: S.custom.conclusion };
  const ex = EXAMPLES[S.exampleKey];
  return ex ? { premises: ex.premises, conclusion: ex.conclusion } : null;
}

function refreshLandingSelection() {
  const arg = currentArgumentStrings();
  const label = $('picker-label'), preview = $('arg-preview');
  if (!arg) { label.textContent = 'Select an argument…'; preview.classList.add('hidden'); $('start-btn').disabled = true; return; }
  const ex = EXAMPLES[S.exampleKey];

// A proof in progress for the same argument and mode is resumed rather than
// replaced, so a trip back to the menu never discards work by accident.
function canResume() {
  if (!S.activeKey || S.activeKey !== argumentKey() ) return false;
  if (S.mode === 'guided') return !!S.gp && S.activeMode === 'guided' && !gComplete(S.gp) && S.gp.lines.some(l => l.kind !== 'premise' && l.kind !== 'goal' || (l.kind === 'goal' && l.f));
  return !!S.fp && S.activeMode === 'free' && S.fp.lines.some(l => l.kind !== 'premise' && !fIsBlank(l));
}
function argumentKey() {
  const a = currentArgumentStrings();
  return a ? (S.exampleKey || '') + '|' + a.premises.join(',') + '|' + a.conclusion : null;
}

  $('logging-notice').innerHTML = loggingEnabled

    : 'Interaction logging is <strong>off</strong>. Steps will not be recorded. You can turn it on in ⚙️ Settings.';
}

// =============================================================================
// STARTING A PROOF
// =============================================================================
function startProof(restore) {
  const arg = currentArgumentStrings();
  if (!arg) return;
  S.premises = arg.premises.map(parseFormula);
  S.conclusion = parseFormula(arg.conclusion);
  S.undo = []; S.redo = [];
  S.inspect = null; S.delPreview = null; S.check = null; S.refDrafts = {};
  S.completed = false; S.congratsShown = false; S.editSnapTaken = false;
  if (S.mode === 'guided') {
    S.gp = restore && restore.gp ? restore.gp : newGuidedProof(S.premises, S.conclusion);
    S.move = newMove(gNextTarget(S.gp, null, []));
    S.completed = gComplete(S.gp);
    S.congratsShown = S.completed;
  } else {
    S.fp = restore && restore.fp ? restore.fp : newFreeProof(S.premises);
    const firstEditable = S.fp.lines.find(l => l.kind !== 'premise' && fIsBlank(l)) || null;
    S.editId = restore ? null : firstEditable && firstEditable.id;
  }
  S.activeKey = argumentKey();
  S.activeMode = S.mode;
  logStart();
  showPage('proof');
  if (S.mode === 'free') focusFreeSrc();
}

    h('h4', { style: 'margin-top:18px' }, 'Conclusion'), concl.el);
  const right = h('div', null,
    h('h4', null, 'Typing formulas'),
    h('div', { class: 'custom-help', html: 'Use capital letters for sentence letters. You can type the symbols with the keypad below or with these shortcuts: <code>~</code> or <code>-</code> for ¬, <code>&amp;</code> for ·, <code>v</code> or <code>|</code> for ∨, <code>-&gt;</code> for →, <code>&lt;-&gt;</code> for ↔. Inside a formula, binary parts are always shown in parentheses so the main connective is clear.' }),
    h('div', { style: 'margin-top:12px' }, keypad(['P', 'Q', 'R', 'S', 'T', 'U'])));
  confirmBtn.addEventListener('click', () => {
    S.custom = { premises: draft.premises.filter(p => p.trim()).map(p => render(parseFormula(p))), conclusion: render(parseFormula(draft.conclusion)) };
    S.exampleKey = 'custom';
    refreshLandingSelection();
    closePicker();
    $('start-btn').focus();
  });
  win.append(
    h('div', { class: 'win-title' }, h('button', { class: 'bevel', type: 'button', onclick: () => renderPickerGrid(win) }, '← Examples'), h('span', null, 'Create your own argument'), h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Close', onclick: closePicker }, '×')),
    h('div', { class: 'custom-body' }, left, right),
    h('div', { class: 'custom-foot' }, h('button', { class: 'bevel', type: 'button', onclick: closePicker }, 'Cancel'), confirmBtn));
  validate();
  setTimeout(() => { const f = premList.querySelector('.fx-input'); if (f) f.focus(); }, 0);
}

// =============================================================================
// LINKS: deep links, share links (current and pre-26 formats)
// =============================================================================
function hostedBaseUrl() {
  try {
    const canonical = document.querySelector('link[rel="canonical"]');
    if (canonical && canonical.href) { const u = new URL(canonical.href, location.href); u.search = ''; u.hash = ''; return u.toString(); }
  } catch (_) {}
  try { if (location.protocol === 'http:' || location.protocol === 'https:') return location.origin + location.pathname; } catch (_) {}
  return null;
}
function exampleUrl(ex) {
  const base = hostedBaseUrl();
  if (!base) return null;
  const u = new URL(base);
  u.searchParams.set('example', ex.slug);
  return u.toString();
}
function b64encode(str) { return btoa(unescape(encodeURIComponent(str))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function b64decode(str) {
  let s = String(str).replace(/-/g, '+').replace(/_/g, '/').replace(/ /g, '+');
  while (s.length % 4) s += '=';
  return decodeURIComponent(escape(atob(s)));
}

function encodeShareState() {
  const data = { v: 2, mode: S.mode, ex: S.exampleKey };
  if (S.exampleKey === 'custom') data.arg = { p: S.custom.premises, c: S.custom.conclusion };
  if (S.mode === 'guided') {
    const P = S.gp;
    data.g = { lines: P.lines.map(l => [l.id, l.kind, l.f ? render(l.f) : '', l.target ? render(l.target) : '', l.scope, l.rule || '', l.refs, l.subs, l.side || '']), subs: P.subs, seq: P.seq, main: P.mainGoal };
  } else {
    if (S.editId) freeCommitRefs(S.editId, true);
    data.f = { lines: S.fp.lines.map(l => [l.id, l.kind, l.depth | 0, l.src || '', l.rule || '', l.refs]), seq: S.fp.seq };
  }
  return b64encode(JSON.stringify(data));
}

function restoreFromShare(encoded) {
  let data;
  try { data = JSON.parse(b64decode(encoded)); } catch (_) { return false; }
  if (!data || typeof data !== 'object') return false;
  if (data.v === 2) {
    if (data.ex === 'custom' && data.arg) S.custom = { premises: data.arg.p || [], conclusion: data.arg.c || '' };
    else if (!EXAMPLES[data.ex]) return false;
    S.exampleKey = data.ex;
    setLandingMode(data.mode === 'free' ? 'free' : 'guided');
    refreshLandingSelection();
    try {
      if (S.mode === 'guided' && data.g) {
        const gp = { lines: data.g.lines.map(a => ({ id: a[0], kind: a[1], f: a[2] ? parseFormula(a[2]) : null, target: a[3] ? parseFormula(a[3]) : null, scope: a[4] || [], rule: a[5] || null, refs: a[6] || [], subs: a[7] || [], side: a[8] || null })), subs: data.g.subs || {}, seq: data.g.seq || 1, mainGoal: data.g.main };
        startProof({ gp });
      } else if (S.mode === 'free' && data.f) {
        const fp = { lines: data.f.lines.map(a => { const l = { id: a[0], kind: a[1], depth: a[2] | 0, src: a[3] || '', f: null, rule: a[4] || null, refs: a[5] || [] }; l.f = parseOrNull(l.src); return l; }), seq: data.f.seq || 1 };
        startProof({ fp });
      } else startProof();
    } catch (_) { startProof(); }
    return true;
  }
  if (data.ex && Array.isArray(data.lines)) return restoreLegacyShare(data);
  return false;
}

// Links made by v18–v25 stored a flat list of lines. Those load into Free mode,
// where the checker can verify them.
function restoreLegacyShare(data) {
  if (!EXAMPLES[data.ex]) return false;
  S.exampleKey = data.ex;
  setLandingMode('free');
  refreshLandingSelection();
  const ex = EXAMPLES[data.ex];
  const fp = newFreeProof(ex.premises.map(parseFormula));
  fp.lines = fp.lines.filter(l => l.kind === 'premise');
  const idByOld = {};
  let premiseIdx = 0;
  data.lines.forEach((s, i) => {
    const oldNum = i + 1;
    if (s.pr) { const p = fp.lines[premiseIdx++]; if (p) idByOld[oldNum] = p.id; return; }
    if (!s.f || s.k === 'blank') return;
    const kind = s.k === 'assumption' ? 'assume' : 'step';
    const l = { id: 'F' + (fp.seq++), kind, depth: s.lv | 0, src: s.f, f: parseOrNull(s.f), rule: kind === 'step' ? (s.r || null) : null, refs: [], _old: s.c || [] };
    idByOld[oldNum] = l.id;
    fp.lines.push(l);
  });
  const an = fAnalyze(fp);
  fp.lines.forEach(l => {
    if (!l._old) return;
    const subRule = SUBPROOF_RULES.has(l.rule);
    l.refs = l._old.map(n => {
      const id = idByOld[n];
      if (!id) return { n: String(n) };
      const idx = fIndex(fp, id);
      if (subRule && fp.lines[idx].kind === 'assume') {
        const sub = Object.values(an.subs).find(s => s.start === idx && s.proper);
        if (sub) return { a: id, b: fp.lines[sub.end].id };
      }
      return { a: id };
    }).filter((r, k, arr) => arr.findIndex(x => x.a === r.a && x.b === r.b && x.n === r.n) === k);
    l.refs = l.refs.filter(r => !(r.a && !r.b && l.refs.some(x => x.b === r.a)));
    delete l._old;
  });
  if (!fp.lines.some(l => l.kind !== 'premise')) fp.lines.push(fLine(fp, 0));
  startProof({ fp });
  openModal({ title: 'Older link', bodyHtml: 'This link was made with an earlier version of the app. Its steps were loaded in <b>Free mode</b>; press <b>Check proof</b> to verify them.', buttons: [{ label: 'OK', primary: true }] });
  return true;
}

function handleUrlParams() {
  const params = new URLSearchParams(location.search);
  const state = params.get('state');
  if (state && restoreFromShare(state)) return;
  const slug = params.get('example');
  if (slug) {
    const key = EXAMPLE_BY_SLUG[slug] || (EXAMPLES[slug] ? slug : null);
    if (!key) return;
    S.exampleKey = key;
    const mode = params.get('mode');
    setLandingMode(mode === 'free' ? 'free' : mode === 'guided' ? 'guided' : S.mode);
    refreshLandingSelection();
    startProof();
  }
}

// =============================================================================
// EXPORT
// =============================================================================
function exportProofText() {
  const ex = EXAMPLES[S.exampleKey];
  const out = [(ex ? 'Argument #' + ex.number : 'Custom argument') + ': ' + S.premises.map(render).join(', ') + ' ∴ ' + render(S.conclusion), ''];
  let rows;
  if (S.mode === 'guided') {
    const P = S.gp, num = id => gIndex(P, id) + 1;
    rows = P.lines.map(l => ({ depth: l.scope.length, text: l.f ? render(l.f) : '[goal: ' + render(l.target) + ']', just: l.f ? gJustText(P, l, num) + (gPending(P, l) ? ' (open)' : '') : '', bar: l.kind === 'assume', premise: l.kind === 'premise' }));
  } else {
    const P = S.fp, an = fAnalyze(P);
    rows = P.lines.map((l, i) => ({ depth: an.info[i].scope.length, text: l.f ? render(l.f) : (l.src || ''), just: l.kind === 'premise' ? 'Premise' : l.kind === 'assume' ? 'Assume' : ((l.rule || '') + ' ' + fRefsText(P, l.refs)).trim(), bar: l.kind === 'assume', premise: l.kind === 'premise' }));
  }
  const lastPrem = rows.reduce((a, r, i) => (r.premise ? i : a), -1);
  const width = Math.max(24, ...rows.map(r => r.depth * 2 + r.text.length + 2));
  rows.forEach((r, i) => {
    const bars = '| '.repeat(r.depth + 1);
    const n = String(i + 1).padStart(3);
    out.push(n + ' ' + (bars + r.text).padEnd(width + 2) + '  ' + r.just);
    if (r.bar || i === lastPrem) out.push('    ' + '| '.repeat(r.depth) + '|' + '-'.repeat(Math.max(4, r.text.length + 1)));
  });
  out.push('');
  const done = S.mode === 'guided' ? gComplete(S.gp) : !!(S.check && S.check.complete);
  out.push(done ? 'Status: complete' : 'Status: not finished');
  return out.join('\n');
}
function exportLogText() { return (LOG_PREAMBLES[S.mode] || '') + '\n' + JSON.stringify(interactionLog, null, 2); }
function downloadText(content, filename) {
  const url = URL.createObjectURL(new Blob([content], { type: 'text/plain;charset=utf-8' }));
  const a = h('a', { href: url, download: filename });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function showExportModal() {
  const onProof = $('proof').classList.contains('active');
  const body = h('div');
  const opt = (title, desc, enabled, fn) => h('button', { class: 'export-option', type: 'button', disabled: !enabled, onclick: () => { fn(); modal.close(); } }, h('strong', null, title), h('span', null, desc + (enabled ? '' : ' (nothing to export yet)')));
  body.append(
    opt('📄 Proof (.txt)', 'Numbered lines with justifications and subproof bars. Readable anywhere, including LMS text boxes.', onProof, () => downloadText(exportProofText(), 'proof.txt')),
    opt('🔍 Interaction log (.json)', 'A record of every action with timestamps. Useful for reviewing how a proof was built.', interactionLog.length > 0, () => downloadText(exportLogText(), 'proof-log.json')));
  const modal = openModal({ title: 'Export', body });
}

// =============================================================================
// SETTINGS
// =============================================================================
function openSettings() { $('settings-panel').classList.remove('hidden'); $('gear-btn').setAttribute('aria-expanded', 'true'); }
function closeSettings() { $('settings-panel').classList.add('hidden'); $('gear-btn').setAttribute('aria-expanded', 'false'); }
function applyColorScheme(scheme) {
  document.documentElement.classList.remove('scheme-cb-rg', 'scheme-hc');
  if (scheme && scheme !== 'default') document.documentElement.classList.add('scheme-' + scheme);
  try { localStorage.setItem('proofapp-scheme', scheme || 'default'); localStorage.setItem('proofapp-settings-ver', '1'); } catch (_) {}
}
function settingsFeedback(text, color) {
  const fb = $('share-feedback');
  fb.textContent = text; fb.style.color = color || '';
  clearTimeout(settingsFeedback.t);
  settingsFeedback.t = setTimeout(() => { fb.textContent = ''; }, 2600);
}
function initSettings() {
  let scheme = 'default';
  try { if (localStorage.getItem('proofapp-settings-ver') === '1') scheme = localStorage.getItem('proofapp-scheme') || 'default'; } catch (_) {}
  applyColorScheme(scheme);
  const radio = document.querySelector('input[name="color-scheme"][value="' + scheme + '"]');
  if (radio) radio.checked = true;
  document.querySelectorAll('input[name="color-scheme"]').forEach(r => r.addEventListener('change', () => applyColorScheme(r.value)));

  try { if (localStorage.getItem('proofapp-logging') === 'off') loggingEnabled = false; } catch (_) {}
  $('logging-toggle').checked = loggingEnabled;
  $('logging-toggle').addEventListener('change', e => {
    loggingEnabled = e.target.checked;
    try { localStorage.setItem('proofapp-logging', loggingEnabled ? 'on' : 'off'); } catch (_) {}
    updateLoggingNotice();
  });
  try { const v = localStorage.getItem('proofapp-hashes'); if (v === 'off') hashesEnabled = false; } catch (_) {}
  $('hash-toggle').checked = hashesEnabled;
  $('hash-toggle').addEventListener('change', e => {
    hashesEnabled = e.target.checked;
    try { localStorage.setItem('proofapp-hashes', hashesEnabled ? 'on' : 'off'); } catch (_) {}
  });

  $('gear-btn').addEventListener('click', e => { e.stopPropagation(); if ($('settings-panel').classList.contains('hidden')) openSettings(); else closeSettings(); });
  document.addEventListener('mousedown', e => { if (!$('settings-panel').contains(e.target) && e.target !== $('gear-btn')) closeSettings(); });
  $('share-btn').addEventListener('click', async () => {
    if (!$('proof').classList.contains('active')) { settingsFeedback('Start a proof first.', 'var(--bad)'); return; }
    const base = hostedBaseUrl();
    if (!base) { settingsFeedback('Links only work when the app is opened from a web address.', 'var(--bad)'); return; }
    const u = new URL(base);
    u.searchParams.set('state', encodeShareState());
    const status = await copyText(u.toString(), 'Copy link manually');
    settingsFeedback(status === 'copied' ? 'Link copied.' : status === 'manual' ? '' : 'Could not copy the link.', status === 'copied' ? 'var(--ok)' : 'var(--bad)');
  });
  $('export-btn').addEventListener('click', () => { closeSettings(); showExportModal(); });
  updateLoggingNotice();
}

// =============================================================================
// KEYBOARD
// =============================================================================
function initKeyboard() {
  document.addEventListener('keydown', e => {
    if (!$('proof').classList.contains('active')) {
      if (e.key === 'Escape' && $('picker-overlay')) closePicker();
      return;
    }
    if ($('overlay-root').children.length) return;
    const typing = e.target.matches && e.target.matches('input, textarea');
    const mod = e.ctrlKey || e.metaKey;
    if (mod && !typing && (e.key === 'z' || e.key === 'Z' || e.key === 'y')) {
      e.preventDefault();
      if (e.key === 'y' || e.shiftKey) redo(); else undo();
      return;
    }
    if (e.key === 'Escape') {
      if (S.mode === 'guided') {
        if (S.move && S.move.rule) { guidedCancelRule(); return; }
        if (S.inspect) { S.inspect = null; renderApp(); return; }
      } else if (S.editId) { freeDeselect(); }
      closeSettings();
      return;
    }
    if (e.key === 'Enter' && !typing && S.mode === 'guided' && S.move && S.move.rule && !e.target.closest('button')) {
      if (gEvaluateMove(S.gp, S.move).ready) { e.preventDefault(); guidedExecute(); }
    }
  });
}

// =============================================================================
// INIT
// =============================================================================
function initApp() {
  buildRuleBank();
  initSettings();
  initKeyboard();
  document.querySelectorAll('.mode-btn').forEach(b => b.addEventListener('click', () => setLandingMode(b.dataset.mode)));
  setLandingMode('guided');
  $('open-picker').addEventListener('click', openPicker);
  $('start-btn').addEventListener('click', () => { if (canResume()) { logEvent('resume', {}); showPage('proof'); } else startProof(); });
  $('restart-btn').addEventListener('click', () => startProof());
  $('back-btn').addEventListener('click', () => { showPage('landing'); refreshLandingSelection(); });
  $('undo-btn').addEventListener('click', undo);
  $('redo-btn').addEventListener('click', redo);
  $('proof-lines').addEventListener('mouseleave', () => { if (S.delPreview) { S.delPreview = null; markDeletePreview(); } });
  window.addEventListener('scroll', hideTooltip, { passive: true });
  refreshLandingSelection();
  handleUrlParams();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initApp);
else initApp();

</script>
