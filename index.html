<!DOCTYPE html>
<!--
  ProofApp26_0: clean rebuild that merges v18.20 (live) and v25a_4 (beta).
    Guided: one place to add a step (the + row above each open goal); the next goal is selected
    automatically; rules with nothing to work with are faded; rule inputs are prefilled from the goal;
    a result that matches its goal closes it; undo/redo and cascade delete; click a line to see its sources.
    Free: real Fitch checker (scope, subproof ranges, every rule including ->I, <->I, ~I, vE); a line
    needs a valid justification before it counts, so the completion code can no longer be earned by
    typing the conclusion; lines are added, indented, and turned into assumptions with buttons or keys.
    Shared: one typed formula input with keypad (replaces the three tree builders); fixed ¬¬P display;
    completion codes, example numbers, ?example= links, instructor view, and settings keys unchanged;
    v2 share links include custom arguments; older share links open in Free mode; working manual-copy
    fallback; no long animations; reduced-motion respected.
  ProofApp25a_4: audits and tightens guided restriction logic so empty valid-target/citation/rule sets under an active selection mean none are selectable, computes add-justification target placement per candidate, and prevents sibling-subproof citations from leaving unrelated target plusses selectable.
  ProofApp25a_1: moves the left guided rail inward next to the proof page, triples the current rule-bank/template slide speed while preserving the same motion, and adds target-plus rocking cues when the justification location is still unchosen.
  ProofApp25a_0: conservative branch from 24_11; pulls the rule-preview tooltip rail inward next to the proof page, doubles the rule-bank/template slide speed without changing the motion, and allows ·I to use the same cited line for both conjunct slots.
  ProofApp24_11: restores the running change log, fixes subproof closure so matching derived lines close the goal without inserting an extra Reit line, refreshes the template/preview after right-panel swap animations so early selections persist visually, and slightly speeds the panel handoff.
  ProofApp24_10: cleanup pass for code hygiene; removes dead helpers and obsolete debug/history scaffolding while preserving the current UI and interaction model.
  ProofApp24_9: switches right-panel swaps to a continuous push model and targets the subproof-closing regression.
  ProofApp18_20: guided mode locks the active target once a rule is selected; background double-click clears guided focus.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProofApp26_0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,600;1,400;1,600;1,700&display=swap" rel="stylesheet">
  <style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --ink: #1b1d21;
  --muted: #5b6370;
  --faint: #8a919c;
  --page: #eef0f3;
  --panel: #ffffff;
  --rule: #c9ced6;
  --bevel-face: #d4d0c8;
  --bevel-hi: #ffffff;
  --bevel-lo: #808080;
  --accent: #b45309;
  --accent-bg: #fff4dc;
  --accent-line: #f0b44c;
  --focus: #1b5d9c;
  --ok: #2e7d32;
  --bad: #b3261e;
  --hl-left-bg: #ffcdd2; --hl-left-fg: #b71c1c; --hl-left-border: #e57373;
  --hl-right-bg: #c8e6c9; --hl-right-fg: #1b5e20; --hl-right-border: #81c784;
  --hl-main-fg: #7b1fa2; --hl-main-bg: transparent;
  --hl-whole-bg: #fff59d;
  --tt-left: #c62828; --tt-right: #2e7d32; --tt-main: #7b1fa2;
}
:root.scheme-cb-rg {
  --hl-left-bg: #bbdefb; --hl-left-fg: #0d47a1; --hl-left-border: #64b5f6;
  --hl-right-bg: #ffe0b2; --hl-right-fg: #b34700; --hl-right-border: #ffb74d;
  --hl-main-fg: #6a1b9a;
  --tt-left: #1565c0; --tt-right: #d35400; --tt-main: #6a1b9a;
}
:root.scheme-hc {
  --hl-left-bg: #fff36a; --hl-left-fg: #000; --hl-left-border: #000;
  --hl-right-bg: #001018; --hl-right-fg: #fff; --hl-right-border: #4ff6ff;
  --hl-main-fg: #4ff6ff; --hl-main-bg: #001018;
  --tt-left: #000; --tt-right: #006d77; --tt-main: #000;
}

body { font-family: Tahoma, Verdana, Arial, sans-serif; background: var(--page); color: var(--ink); line-height: 1.4; font-size: 14px; }
button { font-family: inherit; font-size: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible { outline: 2px dotted var(--focus); outline-offset: 2px; }
.mono, .fx, .arg-line, .fx-input, .cite-input { font-family: 'Courier New', Courier, monospace; }
.hidden { display: none !important; }
.page { display: none; }
.page.active { display: block; }

/* ── Shared window chrome ───────────────────────────────────────────── */
.win { background: var(--panel); border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); }
.win-title { background: #e0e0e0; border-bottom: 2px solid var(--ink); padding: 8px 12px; font-weight: bold; font-size: 13px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.bevel { background: var(--bevel-face); border: none; border-top: 2px solid var(--bevel-hi); border-left: 2px solid var(--bevel-hi); border-right: 2px solid var(--bevel-lo); border-bottom: 2px solid var(--bevel-lo); box-shadow: 1px 1px 0 #404040; cursor: pointer; padding: 5px 12px; font-size: 12px; font-weight: bold; white-space: nowrap; }
.bevel:hover:not(:disabled) { background: #dedad2; }
.bevel:active:not(:disabled), .bevel.pressed { border-top-color: var(--bevel-lo); border-left-color: var(--bevel-lo); border-right-color: var(--bevel-hi); border-bottom-color: var(--bevel-hi); box-shadow: inset 1px 1px 0 #404040; }
.bevel:disabled { color: #8f8f8f; cursor: not-allowed; text-shadow: 1px 1px 0 #fff; }
.bevel.primary { background: #1d1d1d; color: #fff; border-color: #000; box-shadow: 2px 2px 0 #888; }
.bevel.primary:hover:not(:disabled) { background: #333; }
.bevel.primary:disabled { background: #a8a8a8; color: #eee; text-shadow: none; box-shadow: none; }
.icon-btn { background: none; border: 1px solid transparent; cursor: pointer; padding: 2px 6px; font-size: 16px; line-height: 1; }
.icon-btn:hover { border-color: #888; background: #f2f2f2; }

/* ── Landing ────────────────────────────────────────────────────────── */
.landing-card { max-width: 500px; margin: 72px auto 40px; }
.landing-card h1 { font-size: 17px; }
.landing-body { padding: 22px 24px 20px; }
.section { margin-bottom: 22px; }
.section-label { display: block; font-weight: bold; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #555; margin-bottom: 8px; }
.mode-toggle { display: flex; gap: 10px; }
.mode-btn { flex: 1; padding: 0; background: none; border: none; cursor: pointer; user-select: none; }
.mode-face { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 12px 10px 11px; background: var(--bevel-face); border-top: 2px solid #fff; border-left: 2px solid #fff; border-right: 2px solid #808080; border-bottom: 2px solid #808080; box-shadow: 1px 1px 0 #404040; position: relative; }
.mode-face::after { content: ''; position: absolute; inset: 4px; border-top: 1px solid #e0dcd4; border-left: 1px solid #e0dcd4; border-right: 1px solid #a09c94; border-bottom: 1px solid #a09c94; pointer-events: none; }
.mode-led { width: 13px; height: 13px; border-radius: 50%; background: #444; box-shadow: inset 0 1px 3px rgba(0,0,0,.6); border: 2px solid #333; }
.mode-label { font-size: 12px; font-weight: bold; letter-spacing: .05em; text-transform: uppercase; }
.mode-btn:hover:not(.active) .mode-face { background: #dedad2; }
.mode-btn.active .mode-face { border-top-color: #808080; border-left-color: #808080; border-right-color: #fff; border-bottom-color: #fff; background: #c8c4bc; box-shadow: inset 2px 2px 4px rgba(0,0,0,.25); transform: translate(1px, 1px); }
.mode-btn.active .mode-face::after { border-top-color: #a09c94; border-left-color: #a09c94; border-right-color: #e0dcd4; border-bottom-color: #e0dcd4; }
.mode-btn.active .mode-led { background: radial-gradient(circle at 35% 35%, #66ff44, #22bb00); box-shadow: 0 0 6px #44ff22, 0 0 12px rgba(68,255,34,.5); border-color: #0a6600; }
.mode-desc { margin-top: 8px; font-size: 12px; color: var(--muted); min-height: 2.6em; }
.picker-btn { width: 100%; padding: 11px 14px; background: #fff; border: 2px solid #888; cursor: pointer; font-size: 14px; text-align: left; display: flex; justify-content: space-between; align-items: center; }
.picker-btn:hover { border-color: #000; background: #f7f8fa; }
.arg-preview { margin-top: 8px; padding: 9px 12px; background: #f8f8f8; border: 1px solid #ddd; font-family: 'Courier New', monospace; font-size: 13px; }
.arg-preview .concl { font-weight: bold; border-top: 1px solid #999; margin-top: 4px; padding-top: 4px; }
.arg-preview .concl::before { content: '∴ '; }
.start-btn { width: 100%; padding: 13px; font-size: 14px; margin-top: 4px; letter-spacing: .03em; }
.link-btn { display: block; margin: 8px auto 0; background: none; border: none; color: var(--focus); text-decoration: underline; cursor: pointer; font-size: 12px; }
.logging-notice { margin-top: 12px; font-size: 11px; color: #888; text-align: center; line-height: 1.5; }

/* ── Settings ───────────────────────────────────────────────────────── */
.gear { position: fixed; top: 10px; right: 12px; z-index: 800; background: none; border: none; cursor: pointer; font-size: 20px; opacity: .55; padding: 4px; }
.gear:hover { opacity: 1; }
#proof .gear-slot .gear { position: static; }
.settings-panel { position: fixed; top: 46px; right: 12px; z-index: 801; width: 250px; padding: 12px 14px; font-size: 12px; }
.settings-panel h5 { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: #888; margin: 0 0 6px; }
.settings-section { margin-bottom: 12px; }
.settings-section:last-child { margin-bottom: 0; }
.settings-option { display: flex; align-items: center; gap: 7px; padding: 3px 0; cursor: pointer; }
.settings-panel .bevel { width: 100%; text-align: left; margin-top: 3px; font-weight: normal; }
.settings-feedback { font-size: 11px; margin-top: 4px; min-height: 1em; }
.version-badge { position: fixed; left: 10px; bottom: 8px; font-size: 10px; color: #666; opacity: .4; pointer-events: none; }

/* ── Example picker ─────────────────────────────────────────────────── */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 16px; }
.picker { width: 1300px; max-width: 98vw; height: 86vh; display: flex; flex-direction: column; }
.picker .win-title { flex-shrink: 0; }
.picker-scroll { overflow-y: auto; padding: 14px 18px 18px; }
.pin-row { display: flex; gap: 8px; align-items: center; padding: 8px 18px; border-bottom: 1px solid #ccc; background: #f6f6f6; font-size: 12px; }
.pin-row input { width: 110px; padding: 3px 6px; border: 1px solid #888; font-family: 'Courier New', monospace; }
.pin-msg { color: var(--bad); }
.phase-head { margin: 16px 0 8px; padding-top: 10px; border-top: 2px solid var(--ink); }
.phase-head:first-child { margin-top: 0; }
.phase-title { font-size: 16px; font-weight: bold; }
.phase-sub { font-size: 12px; font-weight: bold; color: #444; }
.phase-detail { font-size: 11px; color: #666; }
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.ex-card { border: 2px solid #ccc; background: #fafafa; padding: 10px 12px; cursor: pointer; font-family: 'Courier New', monospace; font-size: 13px; text-align: left; display: flex; flex-direction: column; gap: 2px; }
.ex-card:hover, .ex-card:focus-visible { border-color: #000; background: #f0f4ff; }
.ex-card.selected { border-color: #000; background: #e8eeff; }
.ex-num { font-family: Tahoma, sans-serif; font-size: 12px; font-weight: bold; color: #444; margin-bottom: 4px; }
.ex-prem { color: #444; white-space: pre-line; }
.ex-concl { font-weight: bold; border-top: 1px solid #bbb; margin-top: 6px; padding-top: 5px; }
.ex-concl::before { content: '∴ '; }
.ex-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; font-family: Tahoma, sans-serif; }
.ex-actions .bevel { padding: 3px 8px; font-size: 11px; font-weight: normal; }
.ex-card.custom { border-style: dashed; align-items: center; justify-content: center; font-family: Tahoma, sans-serif; color: #555; font-style: italic; min-height: 80px; }

/* Custom argument builder */
.custom-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; padding: 18px; overflow-y: auto; }
.custom-body h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: #666; margin-bottom: 8px; }
.custom-row { display: flex; gap: 6px; align-items: flex-start; margin-bottom: 8px; }
.custom-row .fx-field { flex: 1; }
.custom-help { font-size: 12px; color: var(--muted); line-height: 1.55; }
.custom-help code { font-family: 'Courier New', monospace; background: #f1f1f1; padding: 0 3px; }
.custom-foot { border-top: 1px solid #ddd; padding: 10px 16px; display: flex; justify-content: flex-end; gap: 8px; flex-shrink: 0; }

/* Formula input */
.fx-field { display: flex; flex-direction: column; gap: 3px; }
.fx-input { width: 100%; padding: 6px 8px; font-size: 15px; border: 2px solid #9aa3ae; background: #fff; }
.fx-input:focus { border-color: var(--focus); outline: none; }
.fx-input.err { border-color: var(--bad); }
.fx-input.good { border-color: var(--ok); }
.fx-msg { font-size: 11px; min-height: 1.2em; color: var(--muted); }
.fx-msg.err { color: var(--bad); }
.keypad { display: flex; flex-wrap: wrap; gap: 4px; }
.key { min-width: 30px; padding: 3px 7px; font-family: 'Courier New', monospace; font-size: 14px; font-weight: bold; }

/* ── Proof page layout ──────────────────────────────────────────────── */
.proof-wrap { max-width: 1320px; margin: 0 auto; padding: 0 16px 40px; }
.proof-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 14px 4px 12px; border-bottom: 2px solid var(--ink); margin-bottom: 14px; }
.proof-header h2 { font-size: 14px; margin-bottom: 4px; display: flex; gap: 10px; align-items: center; }
.mode-chip { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; padding: 2px 7px; border: 1px solid #888; background: #fff; color: #444; font-weight: bold; }
.arg-line { font-size: 15px; }
.arg-line .therefore { font-weight: bold; }
.header-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
.proof-main { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(300px, 1fr); gap: 18px; align-items: start; }
.side { position: sticky; top: 12px; display: flex; flex-direction: column; gap: 12px; }
@media (max-width: 980px) {
  .proof-main { grid-template-columns: 1fr; }
  .side { position: static; }
}
.status { padding: 9px 12px; border-bottom: 1px solid var(--rule); background: #f7f8fa; font-size: 13px; min-height: 2.5em; }
.status.ready { background: #eef7ee; }
.status.done { background: #efe7f8; color: #4a148c; font-weight: bold; }
.status .fx-inline { font-family: 'Courier New', monospace; font-weight: bold; }

/* ── Proof lines (Fitch) ────────────────────────────────────────────── */
.proof-lines { padding: 10px 10px 14px; }
.row { display: grid; grid-template-columns: 2.3em minmax(0, 1fr) auto 1.9em; align-items: stretch; min-height: 2.15em; position: relative; }
.row > .num { display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.row > .body { display: flex; align-items: stretch; min-width: 0; }
.row > .just { display: flex; align-items: center; justify-content: flex-end; padding: 0 6px 0 12px; font-size: 12px; font-style: italic; color: #4a515c; white-space: nowrap; }
.row > .act { display: flex; align-items: center; justify-content: center; }
.bar { flex: 0 0 18px; border-left: 2px solid #2b2f36; }
.bar.start { margin-top: 6px; }
.bar.end { margin-bottom: 6px; }
.fx { align-self: center; margin-left: -16px; padding: 4px 10px 4px 22px; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.fx.hbar { box-shadow: inset 0 -2px 0 #2b2f36; padding-right: 2.2em; }
.row.line { cursor: default; }
.row.line.clickable { cursor: pointer; }
.row.line:hover { background: #f5f7fa; }
.row.premise .just, .row.assume .just { color: #6a717c; }
.row.goal.open .fx { color: #6a717c; font-style: italic; }
.gap-wrap { display: flex; align-items: center; min-width: 0; }
.row.goal .just .goal-tag { font-style: normal; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; border: 1px dashed #9aa3ae; padding: 1px 6px; color: #6a717c; }
.row.goal.current .just .goal-tag { border-style: solid; border-color: var(--accent-line); color: var(--accent); background: var(--accent-bg); }
.pending-tag { font-style: normal; font-size: 10px; color: #8a6d00; margin-left: 5px; border: 1px solid #e6cf7a; background: #fff8dc; padding: 0 4px; }
.trash { opacity: 0; border: none; background: none; cursor: pointer; font-size: 13px; padding: 2px 4px; color: #555; }
.row:hover .trash, .trash:focus-visible { opacity: .55; }
.trash:hover { opacity: 1 !important; color: var(--bad); }
.row.flash { animation: rowflash 900ms ease-out; }
@keyframes rowflash { from { background: #d9f2db; } to { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .row.flash { animation: none; } }

/* add-step gap (the single place to add a step) */
.row.gap { min-height: 2.3em; }
.add-step { align-self: center; margin: 3px 0 3px 4px; padding: 3px 12px 3px 8px; border: 1px dashed #98a1ad; background: #fbfcfd; color: #4b5562; cursor: pointer; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; border-radius: 3px; }
.add-step .plus { font-size: 16px; font-weight: bold; line-height: 1; }
.add-step:hover:not(:disabled) { border-color: #4b5562; background: #f1f4f7; }
.add-step:disabled { opacity: .35; cursor: not-allowed; }
.row.gap.current .add-step { border: 2px solid var(--accent-line); background: var(--accent-bg); color: var(--accent); font-weight: bold; }
.gap-preview { align-self: center; margin-left: 10px; font-family: 'Courier New', monospace; font-size: 14px; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gap-preview .note { font-family: Tahoma, sans-serif; font-size: 11px; color: var(--accent); margin-left: 6px; }

/* guided highlighting */
.row.cand { background: #fffbea; cursor: pointer; }
.row.cand:hover { background: #fff3c4; }
.row.cand > .num { color: var(--accent); font-weight: bold; }
.row.dim > .body, .row.dim > .just { opacity: .32; }
.row.slotted { background: #fff4dc; box-shadow: inset 4px 0 0 var(--accent-line); }
.row.inspect { box-shadow: inset 0 0 0 2px #7a3df0; background: #f6f1ff; }
.row.src { background: #fffde7; }
.row.del { background: #f4e9fb; box-shadow: inset 4px 0 0 #9a6ac8; }
.hl-l { background: var(--hl-left-bg); color: var(--hl-left-fg); border: 1px solid var(--hl-left-border); padding: 0 3px; font-weight: bold; }
.hl-r { background: var(--hl-right-bg); color: var(--hl-right-fg); border: 1px solid var(--hl-right-border); padding: 0 3px; font-weight: bold; }
.hl-m { color: var(--hl-main-fg); background: var(--hl-main-bg); font-weight: bold; font-size: 1.08em; padding: 0 1px; }
.hl-w { background: var(--hl-whole-bg); padding: 0 3px; font-weight: bold; }

/* free mode rows */
.row.editing { background: #eef5ff; box-shadow: inset 0 0 0 2px #7aa7da; }
.row.editing .fx { overflow: visible; }
.row.free-line:not(.editing) { cursor: pointer; }
.row.cited > .num { color: #fff; }
.row.cited > .num span { background: var(--accent); color: #fff; padding: 1px 5px; border-radius: 2px; }
.row .num.citable { cursor: pointer; }
.row .num.citable span { border: 1px dashed #b7bec8; padding: 0 4px; border-radius: 2px; }
.row .num.citable:hover span { border-color: var(--accent); color: var(--accent); }
.fx .raw-bad { color: var(--bad); }
.fx .empty { color: #aab0b9; font-style: italic; }
.row .fx-input { margin: 3px 0; padding: 3px 6px; font-size: 15px; min-width: 14em; }
.just-edit { display: flex; gap: 5px; align-items: center; font-style: normal; }
.rule-pill { font-style: normal; font-weight: bold; padding: 1px 7px; border: 1px solid #888; background: #fff; cursor: pointer; font-size: 12px; min-width: 3.2em; text-align: center; }
.rule-pill.empty { color: #999; font-weight: normal; border-style: dashed; }
.cite-input { width: 7.5em; padding: 2px 5px; font-size: 13px; border: 1px solid #9aa3ae; }
.check-mark { font-weight: bold; font-size: 14px; }
.check-mark.ok { color: var(--ok); }
.check-mark.bad { color: var(--bad); }
.row.bad-line { background: #fdf0ef; }
.msg-row { padding: 2px 8px 7px calc(2.3em + 8px); color: var(--bad); font-size: 12px; }
.row.ghost .fx { color: #9aa1ab; font-style: italic; }

/* ── Side panels ────────────────────────────────────────────────────── */
.panel-body { padding: 10px 12px 12px; }
.rules-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.aux-rules { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
.rule-btn { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: space-between; min-height: 68px; padding: 8px 2px 7px; background: var(--bevel-face); border: none; border-top: 2px solid #fff; border-left: 2px solid #fff; border-right: 2px solid #808080; border-bottom: 2px solid #808080; box-shadow: 1px 1px 0 #404040; cursor: pointer; }
.rule-btn::before { content: ''; position: absolute; inset: 4px; border-top: 1px solid rgba(255,255,255,.78); border-left: 1px solid rgba(255,255,255,.78); border-right: 1px solid rgba(115,115,115,.6); border-bottom: 1px solid rgba(115,115,115,.6); pointer-events: none; }

<script>
"use strict";
// =============================================================================
// LOGIC CORE: formulas, parsing, rendering
// Formulas are plain objects:
//   { type: 'atom', name }   { type: 'not', child }
//   { type: 'and' | 'or' | 'imp' | 'iff', left, right }
// Formulas are treated as immutable values; they are never edited in place.
// =============================================================================

const OP_SYMBOL = { and: '·', or: '∨', imp: '→', iff: '↔' };
const SYMBOL_OP = { '·': 'and', '∨': 'or', '→': 'imp', '↔': 'iff' };

function mkAtom(name) { return { type: 'atom', name }; }
function mkNot(child) { return { type: 'not', child }; }
function mkBin(type, left, right) { return { type, left, right }; }
function mkAnd(l, r) { return mkBin('and', l, r); }
function mkOr(l, r) { return mkBin('or', l, r); }
function mkImp(l, r) { return mkBin('imp', l, r); }
function mkIff(l, r) { return mkBin('iff', l, r); }
function isBinary(f) { return !!f && (f.type === 'and' || f.type === 'or' || f.type === 'imp' || f.type === 'iff'); }

function eq(a, b) {
  if (!a || !b || a.type !== b.type) return false;
  if (a.type === 'atom') return a.name === b.name;
  if (a.type === 'not') return eq(a.child, b.child);
  return eq(a.left, b.left) && eq(a.right, b.right);
}

function atomsOf(f, out = new Set()) {
  if (!f) return out;
  if (f.type === 'atom') out.add(f.name);
  else if (f.type === 'not') atomsOf(f.child, out);
  else { atomsOf(f.left, out); atomsOf(f.right, out); }
  return out;
}

// Display policy: every binary subformula is parenthesized when it appears
// inside another formula; negation attaches directly (¬¬P, ¬(P · Q)).
function render(f) {
  if (!f) return '';
  if (f.type === 'atom') return f.name;
  if (f.type === 'not') return '¬' + renderSub(f.child);
  return renderSub(f.left) + ' ' + OP_SYMBOL[f.type] + ' ' + renderSub(f.right);
}
function renderSub(f) { return isBinary(f) ? '(' + render(f) + ')' : render(f); }

// Pre-26 renderer, kept only so completion codes for custom arguments stay
// identical to the ones issued by v18.
function renderLegacy(ast) {
  if (!ast) return '';
  const PREC = { iff: 1, imp: 2, or: 3, and: 4, not: 5, atom: 6 };
  const prec = n => (n ? PREC[n.type] || 0 : 0);
  const child = (c, parentType, side) => {
    const s = renderLegacy(c), cp = prec(c), pp = PREC[parentType];
    if (cp < pp) return '(' + s + ')';
    if (cp === pp) {
      if (parentType === 'imp' && side === 'left' && c.type === 'imp') return '(' + s + ')';
      if (parentType === 'iff' && c.type === 'iff') return '(' + s + ')';
      if (parentType === 'and' && c.type === 'and') return '(' + s + ')';
      if (parentType === 'or' && c.type === 'or') return '(' + s + ')';
    }
    if (parentType === 'imp' || parentType === 'iff') {
      const simple = c.type === 'atom' || (c.type === 'not' && c.child && c.child.type === 'atom');
      if (!simple) return '(' + s + ')';
    }
    return s;
  };
  switch (ast.type) {
    case 'atom': return ast.name;
    case 'not': return ast.child.type !== 'atom' ? '¬(' + renderLegacy(ast.child) + ')' : '¬' + renderLegacy(ast.child);
    default: return child(ast.left, ast.type, 'left') + ' ' + OP_SYMBOL[ast.type] + ' ' + child(ast.right, ast.type, 'right');
  }
}

// ── Input normalization: accept common ASCII and textbook alternatives ──────
function normalizeFormulaInput(s) {
  return String(s || '')
    .replace(/<->|<=>|<>|≡|⇔/g, '↔')
    .replace(/->|=>|⊃|⇒|>/g, '→')
    .replace(/[&^∧*•]|\.(?=\s*[A-Z(¬~\-!\[])/g, '·')
    .replace(/\|\||[|v]/g, '∨')
    .replace(/[~!−-]/g, '¬')
    .replace(/\[/g, '(').replace(/\]/g, ')');
}

// Gentler conversion applied while a student is typing, so that partial
// arrows like "-" or "<-" are not converted before they are finished.
function liveConvertFormulaInput(s) {
  return String(s || '')
    .replace(/<->|<=>|<>/g, '↔')
    .replace(/->|=>/g, '→')
    .replace(/(?<![<\-=])>/g, '→')
    .replace(/[&^*]/g, '·')
    .replace(/\||v/g, '∨')
    .replace(/[~!]/g, '¬')
    .replace(/-(?=[A-Z(¬\[])/g, '¬');
}

class FormulaError extends Error {}

function tokenize(input) {
  const s = normalizeFormulaInput(input);
  const tokens = [];
  let i = 0;
  while (i < s.length) {
    const ch = s[i];
    if (/\s/.test(ch)) { i++; continue; }
    if (ch === '(' || ch === ')') { tokens.push({ t: ch, pos: i }); i++; continue; }
    if (ch === '¬') { tokens.push({ t: 'not', pos: i }); i++; continue; }
    if (SYMBOL_OP[ch]) { tokens.push({ t: 'bin', op: SYMBOL_OP[ch], sym: ch, pos: i }); i++; continue; }
    if (/[A-Z]/.test(ch)) {
      let j = i + 1;
      while (j < s.length && /[0-9]/.test(s[j])) j++;
      tokens.push({ t: 'atom', name: s.slice(i, j), pos: i });
      i = j; continue;
    }
    if (/[a-z]/.test(ch)) throw new FormulaError('Use capital letters for sentence letters (P, Q, R, …).');
    throw new FormulaError('Unexpected character “' + ch + '”.');
  }
  return tokens;
}

// Precedence (loosest to tightest): ↔, → (right-assoc), ∨, ·, ¬
function parseFormula(input) {
  const tokens = tokenize(input);
  if (!tokens.length) throw new FormulaError('Enter a formula.');
  let pos = 0;
  const peek = () => tokens[pos];
  const describe = tk => !tk ? 'the end' : tk.t === 'bin' ? '“' + tk.sym + '”' : tk.t === 'atom' ? tk.name : '“' + tk.t + '”';

  function primary() {
    const tk = peek();
    if (!tk) {
      const prev = tokens[pos - 1];
      throw new FormulaError(prev && prev.t === 'bin' ? 'Missing a formula after “' + prev.sym + '”.' : prev && prev.t === 'not' ? 'Missing a formula after “¬”.' : 'The formula ends too early.');
    }
    if (tk.t === 'not') { pos++; return mkNot(primary()); }
    if (tk.t === '(') {
      pos++;
      const inner = iff();
      if (!peek() || peek().t !== ')') throw new FormulaError('Missing “)”.');
      pos++;
      return inner;
    }
    if (tk.t === 'atom') { pos++; return mkAtom(tk.name); }
    if (tk.t === ')') throw new FormulaError(pos === 0 ? 'Unexpected “)”.' : 'Empty parentheses or a missing formula before “)”.');
    if (tk.t === 'bin') throw new FormulaError('Missing a formula before “' + tk.sym + '”.');
    throw new FormulaError('Unexpected ' + describe(tk) + '.');
  }
  function level(type, next) {
    let node = next();
    while (peek() && peek().t === 'bin' && peek().op === type) { pos++; node = mkBin(type, node, next()); }
    return node;
  }
  const and = () => level('and', primary);
  const or = () => level('or', and);
  function imp() {
    const left = or();
    if (peek() && peek().t === 'bin' && peek().op === 'imp') { pos++; return mkImp(left, imp()); }
    return left;
  }
  const iff = () => level('iff', imp);

  const result = iff();
  if (pos < tokens.length) {
    const tk = peek();
    if (tk.t === ')') throw new FormulaError('Unmatched “)”.');
    throw new FormulaError('Missing a connective before ' + describe(tk) + '.');
  }
  return result;
}

function tryParse(input) {
  try { return { f: parseFormula(input), error: null }; }
  catch (e) { return { f: null, error: e instanceof FormulaError ? e.message : 'Not a formula.' }; }
}
function parseOrNull(input) { return tryParse(input).f; }

function escapeHtml(text) {
  return String(text == null ? '' : text)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ── Highlighted rendering ────────────────────────────────────────────────────
// Roles: 'L' (left/first, red), 'R' (right/second, green), 'M' (main, purple),
// 'W' (whole, yellow). Pieces of a formula keep their display parentheses.
const HL_CLASS = { L: 'hl-l', R: 'hl-r', M: 'hl-m', W: 'hl-w' };
function hl(role, text) { return '<span class="' + HL_CLASS[role] + '">' + escapeHtml(text) + '</span>'; }
function hlWhole(f, role) { return hl(role, render(f)); }
function hlSplit(f, leftRole = 'L', rightRole = 'R') {
  if (!isBinary(f)) return hlWhole(f, leftRole);
  return hl(leftRole, renderSub(f.left)) + ' ' + hl('M', OP_SYMBOL[f.type]) + ' ' + hl(rightRole, renderSub(f.right));
}
function hlNeg(f, innerRole) {
  // ¬φ with ¬ as main connective and φ in innerRole
  return hl('M', '¬') + hl(innerRole, renderSub(f.child));
}
function hlDoubleNeg(f) {
  return hl('M', '¬¬') + hl('R', renderSub(f.child.child));
}

// =============================================================================
// EXAMPLES AND COMPLETION CODES (codes are unchanged from v18)
// =============================================================================
const EXAMPLE_SECTIONS = [
  { title: "Phase One", subtitle: "Requires: Basic Rules", details: "Basic rules: · intro, · elim, ¬ elim, ∨ intro", items: [
    { key: "ex001", slug: "1", number: 1, premises: ["P · Q","S · R"], conclusion: "P · R" },
    { key: "ex002", slug: "2", number: 2, premises: ["¬¬P · R","S"], conclusion: "P · S" },
    { key: "ex003", slug: "3", number: 3, premises: ["S"], conclusion: "S ∨ ¬Q" },
    { key: "ex004", slug: "4", number: 4, premises: ["S","R"], conclusion: "(S ∨ Q) · (P ∨ R)" },
    { key: "ex005", slug: "5", number: 5, premises: ["P · Q"], conclusion: "Q · P" },

function generateCompletionCode(exampleNumber) {
  const x = Number(exampleNumber) || 0;
  const unitValue = Math.abs(
    Math.sin((x ** 3 + 17 * x ** 2 + 29 * x + 43) / 7) +
    Math.cos((19 * x ** 2 + 23 * x + 11) / 13) +
    Math.sin(Math.sqrt(x + 3) * 23) +
    Math.cos(Math.log(x + 11) * 29) +
    Math.sin(Math.log10(x + 101) * 31)
  ) / (5 + Math.abs(Math.tan((x + 5) / 17)));
  const normalized = Math.floor(10000000 + 89999999 * unitValue);
  return String(normalized).padStart(8, '0');
}

function generateSeededCompletionCode(seed) {
  const str = String(seed || '');
  let h1 = 0x811c9dc5;
  let h2 = 0x9e3779b9;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 ^= ch;
    h1 = Math.imul(h1, 0x01000193);
    h1 >>>= 0;
    h2 ^= ch + i;
    h2 = Math.imul(h2, 0x85ebca6b);
    h2 = ((h2 << 13) | (h2 >>> 19)) >>> 0;
  }
  const mixed = (BigInt(h1 >>> 0) << 32n) ^ BigInt(h2 >>> 0) ^ BigInt(str.length);
  const code = Number(mixed % 90000000n) + 10000000;
  return String(code).padStart(8, '0');
}

const COMPLETION_CODES = {};
Object.values(EXAMPLES).forEach(ex => { COMPLETION_CODES[ex.key] = generateCompletionCode(ex.number); });

function completionCodeFor(exampleKey, premiseAsts, conclusionAst) {
  if (exampleKey && COMPLETION_CODES[exampleKey]) return COMPLETION_CODES[exampleKey];
  const premiseSeed = (premiseAsts || []).map(renderLegacy).join(' || ');
  const conclusionSeed = conclusionAst ? renderLegacy(conclusionAst) : '';
  return generateSeededCompletionCode(premiseSeed + ' => ' + conclusionSeed);
}

// Static rule schemas (Greek letters), used for hover cards and as the base of
// the live preview in the step panel.
function schemaHtml(rule) {
  const r = t => '<span class="tt-l">' + t + '</span>';
  const g = t => '<span class="tt-r">' + t + '</span>';
  const p = t => '<span class="tt-m">' + t + '</span>';
  const ln = x => '<div class="sc-line">' + x + '</div>';
  const cc = x => '<div class="sc-concl">' + x + '</div>';
  const sub = (a, b) => '<div class="sc-sub">' + ln(a) + ln('⋮') + ln(b) + '</div>';
  const box = x => '<div class="sc-box">' + x + '</div>';
  switch (rule) {
    case '→E': return box(ln(r('φ') + ' → ' + g('ψ')) + ln(r('φ')) + cc(g('ψ')));
    case '↔E': return box(ln(r('φ') + ' ↔ ' + g('ψ')) + ln(r('φ')) + cc(g('ψ'))) + box(ln(r('φ') + ' ↔ ' + g('ψ')) + ln(g('ψ')) + cc(r('φ')));
    case '·E': return box(ln(r('φ') + ' · ' + g('ψ')) + cc(r('φ'))) + box(ln(r('φ') + ' · ' + g('ψ')) + cc(g('ψ')));
    case '·I': return box(ln(r('φ')) + ln(g('ψ')) + cc(r('φ') + ' · ' + g('ψ')));
    case '∨I': return box(ln(r('φ')) + cc(r('φ') + ' ∨ ' + g('ψ'))) + box(ln(g('ψ')) + cc(r('φ') + ' ∨ ' + g('ψ')));
    case '∨E': return box(ln(r('φ') + ' ∨ ' + g('ψ')) + sub(r('φ'), p('θ')) + sub(g('ψ'), p('θ')) + cc(p('θ')));
    case '¬E': return box(ln('¬¬' + g('φ')) + cc(g('φ')));
    case '¬I': return box(sub(g('φ'), r('ψ') + ' · ¬' + r('ψ')) + cc('¬' + g('φ')));
    case '→I': return box(sub(r('φ'), g('ψ')) + cc(r('φ') + ' → ' + g('ψ')));
    case '↔I': return box(sub(r('φ'), g('ψ')) + sub(g('ψ'), r('φ')) + cc(r('φ') + ' ↔ ' + g('ψ')));
    case 'Reit': return box(ln(r('φ')) + cc(r('φ')));
    case 'Expl': return box(ln(r('φ')) + ln('¬' + r('φ')) + cc(g('ψ')));
    default: return '';
  }
}


// =============================================================================
// GUIDED ENGINE (no DOM)
//
// A guided proof is a list of lines plus a registry of subproofs.
//   line: { id, kind: 'premise'|'assume'|'step'|'goal', f, target, scope,
//           rule, refs, subs, side }
//   scope: array of subproof ids, outermost first ([] = main proof)
//   goal lines: one per scope, always the last line of that scope.
//     open goal: f === null (shows the target formula and the + row above it)
//     filled goal: f equals target
//   subs (on a line): subproof ids this line discharges (→I, ↔I, ¬I, ∨E)
//   registry: { id, rule, parent, assume, goal, owner }
//
// Invariant that keeps the interaction simple: every unfinished scope has
// exactly one open goal, and new steps always go directly above it.
// =============================================================================

function newGuidedProof(premiseAsts, conclusionAst) {
  const P = { lines: [], subs: {}, seq: 1, mainGoal: null };
  premiseAsts.forEach(f => P.lines.push(gLine(P, { kind: 'premise', f })));
  const goal = gLine(P, { kind: 'goal', target: conclusionAst });
  P.lines.push(goal);
  P.mainGoal = goal.id;
  return P;
}

function gLine(P, props) {
  return Object.assign({ id: 'L' + (P.seq++), kind: 'step', f: null, target: null, scope: [], rule: null, refs: [], subs: [], side: null }, props);
}

function gFind(P, id) { return P.lines.find(l => l.id === id) || null; }
function gIndex(P, id) { return P.lines.findIndex(l => l.id === id); }
function isOpenGoal(l) { return !!l && l.kind === 'goal' && !l.f; }
function gOpenGoals(P) { return P.lines.filter(isOpenGoal); }
function scopeIsPrefix(prefix, full) {
  if (prefix.length > full.length) return false;
  for (let i = 0; i < prefix.length; i++) if (prefix[i] !== full[i]) return false;
  return true;
}

function gResolved(P, l) {
  if (!l || !l.f) return false;
  return (l.subs || []).every(sid => P.subs[sid] && gResolved(P, gFind(P, P.subs[sid].goal)));
}
function gPending(P, l) { return !!(l && l.f && l.subs && l.subs.length && !gResolved(P, l)); }
function gComplete(P) { return gOpenGoals(P).length === 0; }

// Lines a new step placed above `goalId` may cite.
function gCitable(P, goalId) {
  const goal = gFind(P, goalId);
  if (!goal) return [];
  const gi = gIndex(P, goalId);
  return P.lines.filter((l, i) => i < gi && l.f && scopeIsPrefix(l.scope, goal.scope));
}

// Default input text when a rule is opened, from the goal it targets.
function gInputDefaults(rule, goalTarget) {
  const T = goalTarget, out = {};
  if (!T) return out;
  if (rule === '∨E') out.theta = render(T);
  if (rule === 'Expl') out.psi = render(T);
  if (rule === '→I' && T.type === 'imp') { out.ant = render(T.left); out.cons = render(T.right); }
  if (rule === '↔I' && T.type === 'iff') { out.left = render(T.left); out.right = render(T.right); }
  if (rule === '¬I' && T.type === 'not') out.assume = render(T.child);
  return out;
}

function slotFormulas(P, fills) {
  const F = {};
  Object.keys(fills || {}).forEach(k => { const l = gFind(P, fills[k]); if (l && l.f) F[k] = l.f; });
  return F;
}

// Can the remaining empty slots be filled, given what is already in F?
function gCompletable(spec, candidates, F) {
  const empty = (spec.slots || []).filter(s => !F[s.id]);
  if (!empty.length) return true;
  const [slot] = empty;
  for (const l of candidates) {
    if (slot.ok(l.f, F)) {
      const next = Object.assign({}, F, { [slot.id]: l.f });
      if (gCompletable(spec, candidates, next)) return true;
    }
  }
  return false;
}

function gRuleApplicable(P, rule, goalId) {
  const spec = GUIDED_RULES[rule];
  if (!spec || !goalId) return false;
  if (!spec.slots || !spec.slots.length) return true;
  return gCompletable(spec, gCitable(P, goalId), {});
}

// Lines that may go into `slotId` now (fit the slot and leave the rest completable).
function gSlotCandidates(P, move, slotId) {
  const spec = GUIDED_RULES[move.rule];
  const slot = spec && (spec.slots || []).find(s => s.id === slotId);
  if (!slot) return [];
  const cands = gCitable(P, move.goal);
  const F = slotFormulas(P, move.fills);
  delete F[slotId];
  return cands.filter(l => slot.ok(l.f, F) && gCompletable(spec, cands, Object.assign({}, F, { [slotId]: l.f })));
}

function gNextEmptySlot(move) {
  const spec = GUIDED_RULES[move.rule];
  const s = (spec && spec.slots || []).find(s => !move.fills[s.id]);
  return s ? s.id : null;
}

function newMove(goalId) { return { goal: goalId || null, rule: null, fills: {}, active: null, inputs: {}, side: null }; }

function gOpenRule(P, move, rule) {
  const goal = gFind(P, move.goal);
  move.rule = rule;
  move.fills = {};
  move.inputs = gInputDefaults(rule, goal && goal.target);
  move.side = GUIDED_RULES[rule].option === 'or' ? 'L' : null;
  move.active = gNextEmptySlot(move);
}

// Fill a slot and apply goal-based defaults that depend on the filled line.
function gFillSlot(P, move, slotId, lineId) {
  move.fills[slotId] = lineId;
  const goal = gFind(P, move.goal), T = goal && goal.target, l = gFind(P, lineId);
  if (move.rule === '·E' && slotId === 'conj' && T) {
    if (eq(T, l.f.left)) move.side = 'L';
    else if (eq(T, l.f.right)) move.side = 'R';
  }
  if (move.rule === '∨I' && slotId === 'known' && T && T.type === 'or') {
    if (eq(l.f, T.left)) { move.side = 'L'; move.inputs.other = render(T.right); }
    else if (eq(l.f, T.right)) { move.side = 'R'; move.inputs.other = render(T.left); }
  }
  move.active = gNextEmptySlot(move);
}

function gClearSlot(move, slotId) {
  delete move.fills[slotId];
  if (move.rule === '·E') move.side = null;
  move.active = slotId;
}

// What the move would produce, or what is still missing.
function gEvaluateMove(P, move) {
  const spec = GUIDED_RULES[move.rule];
  const out = { ready: false, missing: [], inputErrors: {}, result: null, closesGoal: false };
  if (!spec) { out.missing.push('rule'); return out; }
  const F = slotFormulas(P, move.fills);
  (spec.slots || []).forEach(s => { if (!F[s.id]) out.missing.push({ slot: s.id, label: s.label }); });
  const I = {};
  (spec.inputs || []).forEach(inp => {
    const text = (move.inputs[inp.id] || '').trim();
    if (!text) { out.missing.push({ input: inp.id, label: inp.label }); return; }
    const r = tryParse(text);
    if (r.f) I[inp.id] = r.f; else { out.inputErrors[inp.id] = r.error; out.missing.push({ input: inp.id, label: inp.label }); }
  });
  if (spec.option && !move.side) out.missing.push({ option: true, label: spec.option === 'conj' ? 'Choose which conjunct' : 'Choose a side' });
  if (out.missing.length) return out;
  const O = { side: move.side };
  out.result = spec.result(F, O, I);
  out.blocks = spec.blocks ? spec.blocks(F, O, I) : [];
  const goal = gFind(P, move.goal);
  out.closesGoal = !!(goal && eq(out.result, goal.target));
  out.ready = true;
  return out;
}

// Apply a ready move. Returns { line, closedGoal, newSubs }.
function gApplyMove(P, move) {
  const ev = gEvaluateMove(P, move);
  if (!ev.ready) return null;
  const spec = GUIDED_RULES[move.rule];
  const goal = gFind(P, move.goal);
  const refs = (spec.slots || []).map(s => move.fills[s.id]);
  let target;
  if (ev.closesGoal) {
    target = goal;
  } else {
    target = gLine(P, { kind: 'step', scope: goal.scope.slice() });
    P.lines.splice(gIndex(P, goal.id), 0, target);
  }
  target.f = ev.result;
  target.rule = move.rule;
  target.refs = refs;
  target.side = spec.option ? move.side : null;
  target.subs = [];
  const newSubs = [];
  let idx = gIndex(P, target.id);
  ev.blocks.forEach(blk => {
    const sid = 'S' + (P.seq++);
    const scope = goal.scope.concat(sid);
    const a = gLine(P, { kind: 'assume', f: blk.assume, scope });
    const g = gLine(P, { kind: 'goal', target: blk.goal, scope });
    P.lines.splice(idx, 0, a, g);
    idx += 2;
    P.subs[sid] = { id: sid, rule: move.rule, parent: goal.scope.length ? goal.scope[goal.scope.length - 1] : null, assume: a.id, goal: g.id, owner: target.id };
    target.subs.push(sid);
    newSubs.push(sid);
  });
  return { line: target, closedGoal: ev.closesGoal, newSubs };
}

// Where to work next after a change.
function gNextTarget(P, prevGoalId, newSubs) {
  if (newSubs && newSubs.length) return P.subs[newSubs[0]].goal;
  const prev = gFind(P, prevGoalId);
  if (isOpenGoal(prev)) return prev.id;
  const open = gOpenGoals(P);
  return open.length ? open[0].id : null;
}

// ── Deletion ────────────────────────────────────────────────────────────────
// Deleting a step also removes everything that depends on it. Deleting an
// assumption removes its whole subproof (and siblings) and the line they
// discharge. Goal lines are never removed while their scope survives; they
// return to open.
function gCanDelete(l) { return !!l && (l.kind === 'step' || l.kind === 'assume' || (l.kind === 'goal' && !!l.f)); }

function gPlanDelete(P, startId) {
  const del = new Set(), revert = new Set(), gone = new Set();
  const queue = [startId];
  function removeSub(sid) {
    if (gone.has(sid) || !P.subs[sid]) return;
    gone.add(sid);
    P.lines.forEach(l => { if (l.scope.includes(sid)) queue.push(l.id); });
    queue.push(P.subs[sid].owner);
  }
  while (queue.length) {
    const id = queue.pop();
    const l = gFind(P, id);
    if (!l || l.kind === 'premise') continue;
    const bucket = l.kind === 'goal' ? revert : del;
    if (bucket.has(id)) continue;
    bucket.add(id);
    if (l.kind === 'goal' && !l.f) continue;
    P.lines.forEach(m => { if ((m.refs || []).includes(id)) queue.push(m.id); });
    (l.subs || []).forEach(removeSub);
    if (l.kind === 'assume') removeSub(l.scope[l.scope.length - 1]);
  }
  revert.forEach(id => {
    const l = gFind(P, id);
    if (l.scope.some(s => gone.has(s))) { revert.delete(id); del.add(id); }
    else if (!l.f) revert.delete(id);
  });
  return { del, revert, gone };
}

function gApplyDelete(P, startId) {
  const plan = gPlanDelete(P, startId);
  if (!plan.del.size && !plan.revert.size) return null;
  const removed = P.lines.filter(l => plan.del.has(l.id) && l.f).map(l => render(l.f));
  P.lines = P.lines.filter(l => !plan.del.has(l.id));
  plan.revert.forEach(id => {
    const l = gFind(P, id);
    if (l) Object.assign(l, { f: null, rule: null, refs: [], subs: [], side: null });
  });
  plan.gone.forEach(sid => { delete P.subs[sid]; });
  return { removed, reverted: plan.revert.size };
}

function gSnapshot(P) { return JSON.stringify(P); }
function gRestore(json) { return JSON.parse(json); }

// Justification text for display, e.g. "→E 2, 3" or "→I 4–6".
function gJustText(P, l, num) {
  if (l.kind === 'premise') return 'Premise';
  if (l.kind === 'assume') return 'Assume';
  if (l.kind === 'goal' && !l.f) return 'goal';
  const parts = [];
  if (l.rule === '∨E' && l.refs[0]) parts.push(String(num(l.refs[0])));
  else if (!SUBPROOF_RULES.has(l.rule)) (l.refs || []).forEach(r => parts.push(String(num(r))));
  (l.subs || []).forEach(sid => {
    const s = P.subs[sid];
    if (s) parts.push(num(s.assume) + '–' + num(s.goal));
  });
  return l.rule + (parts.length ? ' ' + parts.join(', ') : '');
}


// =============================================================================
// FREE MODE ENGINE (no DOM)
//
// The student writes every line. Structure comes from indentation (depth) and
// assumption lines, exactly as on paper:
//   line: { id, kind: 'premise'|'assume'|'step', depth, src, f, rule, refs }
//   refs: [{ a: lineId }] for single lines, [{ a: startId, b: endId }] for
//         subproof ranges, [{ n: number }] for numbers that matched no line.
// The checker validates every line, including subproof rules and scope.
// =============================================================================

function newFreeProof(premiseAsts) {
  const P = { lines: [], seq: 1 };
  premiseAsts.forEach(f => P.lines.push({ id: 'F' + (P.seq++), kind: 'premise', depth: 0, src: render(f), f, rule: null, refs: [] }));
  P.lines.push(fLine(P, 0));
  return P;
}

function fLine(P, depth, kind = 'step') {
  return { id: 'F' + (P.seq++), kind, depth: Math.max(0, depth), src: '', f: null, rule: null, refs: [] };
}
function fFind(P, id) { return P.lines.find(l => l.id === id) || null; }
function fIndex(P, id) { return P.lines.findIndex(l => l.id === id); }
function fIsBlank(l) { return l.kind === 'step' && !String(l.src || '').trim() && !l.rule && !(l.refs || []).length; }
function fSetSource(l, src) { l.src = src; l.f = parseOrNull(src); }

function fInsertAfter(P, afterId, depth, kind = 'step') {
  const line = fLine(P, depth, kind);
  const i = afterId ? fIndex(P, afterId) : P.lines.length - 1;
  P.lines.splice(i + 1, 0, line);
  return line;
}
function fDelete(P, id) {
  const l = fFind(P, id);
  if (!l || l.kind === 'premise') return false;
  P.lines = P.lines.filter(x => x.id !== id);
  if (!P.lines.some(x => x.kind !== 'premise')) P.lines.push(fLine(P, 0));
  return true;
}

// ── Structure analysis ──────────────────────────────────────────────────────
// Returns per-line scope (subproof ids, outermost first) and structural errors,
// plus the subproof table { id: { start, end, parent } } using line indexes.
function fAnalyze(P) {
  const info = P.lines.map(() => ({ scope: [], errors: [] }));
  const subs = {};
  const stack = [];
  const close = endIdx => { const s = stack.pop(); subs[s].end = endIdx; };
  P.lines.forEach((l, i) => {
    const d = l.kind === 'premise' ? 0 : Math.max(0, l.depth | 0);
    const isAssume = l.kind === 'assume';
    while (stack.length > d || (isAssume && d > 0 && stack.length === d)) close(i - 1);
    while (stack.length < d) {
      const opening = isAssume && stack.length === d - 1;
      const sid = 'X' + i + '_' + stack.length;
      subs[sid] = { id: sid, start: i, end: i, parent: stack.length ? stack[stack.length - 1] : null, proper: opening };
      if (!opening && !info[i].errors.length) {
        info[i].errors.push(isAssume ? 'This assumption is indented more than one level past the line above it.' : 'A new subproof has to begin with an assumption. Make this line an assumption or move it left.');
      }
      stack.push(sid);
    }
    if (isAssume && d === 0) info[i].errors.push('An assumption has to start a subproof. Indent it one level.');
    info[i].scope = stack.slice();
  });
  while (stack.length) close(P.lines.length - 1);
  return { info, subs };
}

// The subproof whose first line is index `start` and last line is `end`.
function fSubAt(an, start, end) {
  return Object.values(an.subs).find(s => s.start === start && s.end === end && s.proper) || null;
}
// The outermost subproof containing line j that is closed before line i and sits
// directly inside a scope that line i can see. Used for click-to-cite.
function fClosedSubFor(an, j, i) {
  const sj = an.info[j].scope, si = an.info[i].scope;
  for (let k = 0; k < sj.length; k++) {
    const sub = an.subs[sj[k]];
    const parentScope = sj.slice(0, k);
    if (scopeIsPrefix(parentScope, si) && !si.includes(sj[k]) && sub.end < i) return sub;
  }
  return null;
}

// Toggle a citation by clicking line `clickedId` while editing line `editId`.
function fToggleCite(P, editId, clickedId) {
  const L = fFind(P, editId);
  const i = fIndex(P, editId), j = fIndex(P, clickedId);
  if (!L || j < 0 || j >= i) return false;
  const an = fAnalyze(P);
  let ref;
  if (scopeIsPrefix(an.info[j].scope, an.info[i].scope)) ref = { a: clickedId };
  else {
    const sub = fClosedSubFor(an, j, i);
    if (!sub) return false;
    ref = { a: P.lines[sub.start].id, b: P.lines[sub.end].id };
  }
  const k = L.refs.findIndex(r => r.a === ref.a && r.b === ref.b);
  if (k >= 0) L.refs.splice(k, 1); else L.refs.push(ref);
  return true;
}

function fRefsText(P, refs) {
  const num = id => { const i = fIndex(P, id); return i >= 0 ? String(i + 1) : '?'; };
  return (refs || []).map(r => r.n != null ? String(r.n) : r.b ? num(r.a) + '–' + num(r.b) : num(r.a)).join(', ');
}
function fParseRefs(P, text) {
  const refs = [];
  const idAt = n => (P.lines[n - 1] ? P.lines[n - 1].id : null);
  String(text || '').split(/[,;\s]+/).filter(Boolean).forEach(tok => {
    const m = tok.match(/^(\d+)\s*[-–—]\s*(\d+)$/);
    if (m) {
      const a = idAt(+m[1]), b = idAt(+m[2]);
      refs.push(a && b ? { a, b } : { n: tok });
    } else if (/^\d+$/.test(tok)) {
      const a = idAt(+tok);
      refs.push(a ? { a } : { n: tok });
    } else refs.push({ n: tok });
  });
  return refs;
}

// ── Checking ────────────────────────────────────────────────────────────────
function fCheck(P, conclusionAst) {
  const an = fAnalyze(P);
  const results = P.lines.map(() => null);
  let problems = 0;
  P.lines.forEach((l, i) => {
    if (l.kind === 'premise') { results[i] = { ok: true }; return; }
    if (fIsBlank(l)) { results[i] = { blank: true }; return; }
    const err = fCheckLine(P, an, i);
    results[i] = err ? { ok: false, msg: err } : { ok: true };
    if (err) problems++;
  });
  const concl = P.lines.findIndex((l, i) => l.kind !== 'premise' && results[i].ok && an.info[i].scope.length === 0 && l.f && eq(l.f, conclusionAst));
  return { results, problems, complete: problems === 0 && concl >= 0, conclusionLine: concl, analysis: an };
}

function fCheckLine(P, an, i) {
  const l = P.lines[i];
  if (an.info[i].errors.length) return an.info[i].errors[0];
  const src = String(l.src || '').trim();
  if (!src) return 'This line has no formula.';
  const parsed = tryParse(src);
  if (!parsed.f) return 'Not a well-formed formula: ' + parsed.error;
  const f = parsed.f;
  if (l.kind === 'assume') {
    if (l.refs && l.refs.length) return 'An assumption does not cite other lines.';
    return null;
  }
  if (!l.rule) return 'Choose a rule for this line.';

  // Resolve citations
  const lines = [], ranges = [];
  for (const r of l.refs || []) {
    if (r.n != null) return '“' + r.n + '” is not a line number in this proof.';
    const a = fIndex(P, r.a);
    if (a < 0) return 'This line cites a line that was deleted.';
    if (r.b) {
      const b = fIndex(P, r.b);
      if (b < 0) return 'This line cites a line that was deleted.';
      const label = (a + 1) + '–' + (b + 1);
      const sub = fSubAt(an, a, b);
      if (!sub) return label + ' is not a whole subproof. Cite from its assumption to its last line.';
      if (b >= i) return 'Subproof ' + label + ' has not ended before this line.';
      if (an.info[i].scope.includes(sub.id)) return 'Subproof ' + label + ' is still open here.';
      const parentScope = an.info[a].scope.slice(0, -1);
      if (!scopeIsPrefix(parentScope, an.info[i].scope)) return 'Subproof ' + label + ' is inside another subproof that has already ended.';
      const fa = parseOrNull(P.lines[a].src), fb = parseOrNull(P.lines[b].src);
      if (!fa || !fb) return 'Subproof ' + label + ' contains a line that is not a well-formed formula.';
      ranges.push({ label, assume: fa, last: fb });
    } else {
      const label = String(a + 1);
      if (a >= i) return 'Line ' + label + ' comes after this line.';
      if (!scopeIsPrefix(an.info[a].scope, an.info[i].scope)) return 'Line ' + label + ' is inside a subproof that has already ended.';
      if (fIsBlank(P.lines[a])) return 'Line ' + label + ' is empty.';
      const fa = parseOrNull(P.lines[a].src);
      if (!fa) return 'Line ' + label + ' is not a well-formed formula.';
      lines.push({ label, f: fa });
    }
  }
  return fCheckRule(l.rule, f, lines, ranges);
}

function fCheckRule(rule, f, lines, ranges) {
  const R = render;
  const want = (nl, nr, text) => (lines.length !== nl || ranges.length !== nr) ? rule + ' cites ' + text + '.' : null;
  switch (rule) {
    case '→E': {
      const e = want(2, 0, 'two lines: a conditional and its antecedent'); if (e) return e;
      const [x, y] = lines;
      const pair = [[x, y], [y, x]].find(([c, a]) => c.f.type === 'imp' && eq(c.f.left, a.f));
      if (!pair) {
        if (x.f.type !== 'imp' && y.f.type !== 'imp') return 'Neither cited line is a conditional.';
        const c = x.f.type === 'imp' ? x : y, a = c === x ? y : x;
        return 'Line ' + a.label + ' is not the antecedent of line ' + c.label + '.';
      }
      return eq(f, pair[0].f.right) ? null : '→E on these lines gives ' + R(pair[0].f.right) + '.';
    }
    case '↔E': {
      const e = want(2, 0, 'two lines: a biconditional and one of its sides'); if (e) return e;
      const [x, y] = lines;
      const pair = [[x, y], [y, x]].find(([b, s]) => b.f.type === 'iff' && (eq(b.f.left, s.f) || eq(b.f.right, s.f)));
      if (!pair) {
        if (x.f.type !== 'iff' && y.f.type !== 'iff') return 'Neither cited line is a biconditional.';
        return 'The other cited line is not a side of the biconditional.';
      }
      const [b, s] = pair;
      const ok = (eq(s.f, b.f.left) && eq(f, b.f.right)) || (eq(s.f, b.f.right) && eq(f, b.f.left));
      return ok ? null : '↔E on these lines gives ' + R(eq(s.f, b.f.left) ? b.f.right : b.f.left) + '.';
    }
    case '·E': {
      const e = want(1, 0, 'one line: a conjunction'); if (e) return e;
      const c = lines[0].f;
      if (c.type !== 'and') return 'Line ' + lines[0].label + ' is not a conjunction.';
      return eq(f, c.left) || eq(f, c.right) ? null : 'This line should be one of the conjuncts of line ' + lines[0].label + '.';
    }
    case '·I': {
      if (ranges.length || lines.length < 1 || lines.length > 2) return '·I cites the line(s) for the two conjuncts.';
      if (f.type !== 'and') return 'A line justified by ·I has to be a conjunction.';
      if (!lines.some(x => eq(x.f, f.left))) return 'The left conjunct ' + R(f.left) + ' is not among the cited lines.';
      if (!lines.some(x => eq(x.f, f.right))) return 'The right conjunct ' + R(f.right) + ' is not among the cited lines.';
      if (lines.length === 2 && !lines.every(x => eq(x.f, f.left) || eq(x.f, f.right))) return 'Each cited line should be one of the conjuncts.';
      return null;
    }
    case '∨I': {
      const e = want(1, 0, 'one line: the disjunct you already have'); if (e) return e;
      if (f.type !== 'or') return 'A line justified by ∨I has to be a disjunction.';
      return eq(f.left, lines[0].f) || eq(f.right, lines[0].f) ? null : 'Line ' + lines[0].label + ' is not one of the disjuncts.';
    }
    case '¬E': {
      const e = want(1, 0, 'one line: a double negation'); if (e) return e;
      const d = lines[0].f;
      if (!(d.type === 'not' && d.child.type === 'not')) return 'Line ' + lines[0].label + ' is not a double negation ¬¬φ.';
      return eq(f, d.child.child) ? null : '¬E on line ' + lines[0].label + ' gives ' + R(d.child.child) + '.';
    }
    case 'Reit': {
      const e = want(1, 0, 'one line'); if (e) return e;
      return eq(f, lines[0].f) ? null : 'A reiterated line has to match line ' + lines[0].label + ' exactly.';
    }
    case 'Expl': {
      const e = want(2, 0, 'two lines: a formula and its negation'); if (e) return e;
      const [x, y] = lines;
      const ok = (y.f.type === 'not' && eq(y.f.child, x.f)) || (x.f.type === 'not' && eq(x.f.child, y.f));
      return ok ? null : 'The cited lines are not a formula and its negation.';
    }
    case '→I': {
      const e = want(0, 1, 'one subproof (assumption–last line)'); if (e) return e;
      const s = ranges[0];
      if (f.type !== 'imp') return 'A line justified by →I has to be a conditional.';
      if (!eq(f.left, s.assume)) return 'The antecedent should be the assumption of ' + s.label + ', ' + R(s.assume) + '.';
      if (!eq(f.right, s.last)) return 'The consequent should be the last line of ' + s.label + ', ' + R(s.last) + '.';
      return null;
    }
    case '¬I': {
      const e = want(0, 1, 'one subproof that ends in a contradiction ψ · ¬ψ'); if (e) return e;
      const s = ranges[0];
      const c = s.last;
      if (!(c.type === 'and' && c.right.type === 'not' && eq(c.right.child, c.left))) return 'Subproof ' + s.label + ' has to end with a contradiction of the form ψ · ¬ψ.';
      return eq(f, mkNot(s.assume)) ? null : 'This line should be ' + R(mkNot(s.assume)) + ', the negation of the assumption.';
    }
    case '↔I': {
      const e = want(0, 2, 'two subproofs, one in each direction'); if (e) return e;
      if (f.type !== 'iff') return 'A line justified by ↔I has to be a biconditional.';
      const [s, t] = ranges;
      const fits = (a, b) => eq(a.assume, f.left) && eq(a.last, f.right) && eq(b.assume, f.right) && eq(b.last, f.left);
      return fits(s, t) || fits(t, s) ? null : 'The subproofs should go from ' + R(f.left) + ' to ' + R(f.right) + ' and from ' + R(f.right) + ' to ' + R(f.left) + '.';
    }
    case '∨E': {
      const e = want(1, 2, 'a disjunction and two subproofs'); if (e) return e;
      const d = lines[0].f;
      if (d.type !== 'or') return 'Line ' + lines[0].label + ' is not a disjunction.';
      const [s, t] = ranges;
      const cases = (a, b) => eq(a.assume, d.left) && eq(b.assume, d.right);
      if (!cases(s, t) && !cases(t, s)) return 'The subproofs should assume ' + R(d.left) + ' and ' + R(d.right) + '.';
      if (!eq(s.last, f) || !eq(t.last, f)) return 'Both subproofs have to end with this line’s formula, ' + R(f) + '.';
      return null;
    }
    default: return 'Unknown rule.';
  }
}

const $ = id => document.getElementById(id);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k, v]) => {
    if (v == null || v === false) return;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'dataset') Object.assign(e.dataset, v);
    else e.setAttribute(k, v === true ? '' : v);
  });
  kids.flat().forEach(k => { if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k))); });
  return e;
}
function fxInline(f) { return '<span class="fx-inline">' + escapeHtml(render(f)) + '</span>'; }

// =============================================================================

function attachLiveConversion(input, onChange) {
  input.addEventListener('focus', () => { S.lastFxInput = input; });
  input.addEventListener('input', () => {
    const raw = input.value, conv = liveConvertFormulaInput(raw);
    if (conv !== raw) {
      const pos = input.selectionStart + (conv.length - raw.length);
      input.value = conv;
      try { input.setSelectionRange(pos, pos); } catch (_) {}
    }
    onChange(input.value);
  });
}

function formulaField({ value = '', placeholder = 'type a formula', focusKey, onChange, showOk = true }) {
  const input = h('input', { class: 'fx-input', type: 'text', value, placeholder, spellcheck: 'false', autocomplete: 'off', 'data-focus-key': focusKey, 'aria-label': placeholder });
  const msg = h('div', { class: 'fx-msg' });
  const update = v => {
    const t = String(v || '').trim();
    if (!t) { input.classList.remove('err', 'good'); msg.className = 'fx-msg'; msg.textContent = ''; return null; }
    const r = tryParse(t);
    input.classList.toggle('err', !r.f);
    input.classList.toggle('good', !!r.f && showOk);
    msg.className = 'fx-msg' + (r.f ? '' : ' err');
    msg.textContent = r.f ? (showOk ? 'Reads as: ' + render(r.f) : '') : r.error;
    return r.f;
  };
  attachLiveConversion(input, v => { update(v); onChange && onChange(v); });
  update(value);
  return { el: h('div', { class: 'fx-field' }, input, msg), input, update };
}

function keypad(atoms) {

function insertAtCursor(text) {
  const input = S.lastFxInput;
  if (!input || !document.body.contains(input)) return;
  const a = input.selectionStart ?? input.value.length, b = input.selectionEnd ?? a;
  input.value = input.value.slice(0, a) + text + input.value.slice(b);
  input.focus();
  try { input.setSelectionRange(a + text.length, a + text.length); } catch (_) {}
  input.dispatchEvent(new Event('input', { bubbles: true }));
}
function argumentAtoms() {
  const set = new Set();
  S.premises.forEach(f => atomsOf(f, set));
  atomsOf(S.conclusion, set);
  return [...set].sort();
}

function currentSnapshot() { return S.mode === 'guided' ? gSnapshot(S.gp) : JSON.stringify(S.fp); }
function pushUndo() {
  S.undo.push(currentSnapshot());
  if (S.undo.length > 60) S.undo.shift();
  S.redo = [];
}
function restoreSnapshot(json) {
  if (S.mode === 'guided') {
    S.gp = gRestore(json);
    S.move = newMove(gNextTarget(S.gp, S.move && S.move.goal, []));
    S.inspect = null;
  } else {
    S.fp = JSON.parse(json);
    if (!fFind(S.fp, S.editId)) S.editId = null;
    S.check = null;
  }
  S.completed = S.mode === 'guided' ? gComplete(S.gp) : false;
}
function undo() {
  if (!S.undo.length) return;
  S.redo.push(currentSnapshot());
  restoreSnapshot(S.undo.pop());
  logEvent('undo', {});
  renderApp();
}
function redo() {
  if (!S.redo.length) return;
  S.undo.push(currentSnapshot());
  restoreSnapshot(S.redo.pop());
  logEvent('redo', {});

}

// ── Fitch bars ───────────────────────────────────────────────────────────────
function computeBars(rows) {
  rows.forEach((r, i) => {
    const s = r.scope || [], prev = rows[i - 1], next = rows[i + 1];
    r.bars = [{ start: i === 0, end: i === rows.length - 1 }];
    s.forEach((sid, k) => r.bars.push({
      start: !prev || (prev.scope || [])[k] !== sid,
      end: !next || (next.scope || [])[k] !== sid
    }));
  });
}
function barsHtml(bars) { return bars.map(b => '<span class="bar' + (b.start ? ' start' : '') + (b.end ? ' end' : '') + '"></span>').join(''); }

function rowEl(r, { classes = [], numHtml, fxHtml, fxClass = '', justHtml = '', actEl = null, onclick, extraBody = null }) {
  const row = h('div', { class: ['row'].concat(classes).join(' '), dataset: r.line ? { id: r.line.id } : {} });
  const num = h('div', { class: 'num', html: numHtml == null ? '' : numHtml });
  const body = h('div', { class: 'body', html: barsHtml(r.bars) });
  if (fxHtml != null) body.append(h('span', { class: 'fx ' + fxClass, html: fxHtml }));
  if (extraBody) body.append(extraBody);
  row.append(num, body, h('div', { class: 'just', html: justHtml }), h('div', { class: 'act' }, actEl));
  if (onclick) row.addEventListener('click', onclick);
  if (onclick && classes.includes('clickable')) {
    row.tabIndex = 0;
    row.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target === row) { e.preventDefault(); e.stopPropagation(); onclick(e); } });
  }
  return row;
}

  host.innerHTML = '';
  if (S.mode === 'guided') renderGuidedLines(host); else renderFreeLines(host);
